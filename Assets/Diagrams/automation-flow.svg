<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="568" viewBox="0 0 1640 568" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><defs><symbol id="lg-semaphore" viewBox="0 0 24 24"><image width="24" height="24" href="data:image/svg+xml;base64,"/></symbol><symbol id="lg-ansible" viewBox="0 0 24 24"><image width="24" height="24" href="data:image/svg+xml;base64,"/></symbol><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B6CB0"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C05621"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C53030"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F855A"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B46C1"/></marker><marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2C7A7B"/></marker></defs><rect width="1640" height="568" fill="#FFFFFF"/><text x="40" y="58" font-size="22" font-weight="700" fill="#1F2933">How one Ansible run reaches authorized keys</text><text x="40" y="80" font-size="13" fill="#5C6873">A run starts from a shell on ansible-01 or from a Semaphore template, loads one identity file, resolves its allowlist, and writes only that identity's key</text><rect x="1466.16" y="44" width="133.835" height="18" rx="9.0" fill="#EEF1F4"/><text x="1533.08" y="56.96" font-size="11" font-weight="600" fill="#3D4852" text-anchor="middle">State as of 2026-09-24</text><rect x="540" y="112" width="560" height="144" rx="10" fill="#F4F4F6" stroke="#BEC2CC"/><path d="M550 112h540a10 10 0 0 1 10 10v20H540v-20a10 10 0 0 1 10 -10z" fill="#BEC2CC" opacity="0.28"/><rect x="932.705" y="118" width="157.295" height="18" rx="9.0" fill="#4A4F5A"/><text x="1011.35" y="130.96" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">ansible-01 · 192.168.40.36</text><text x="552" y="132" font-size="13" font-weight="700" fill="#4A4F5A">Two ways to launch the same playbooks</text><rect x="553" y="156" width="220" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="552" y="154" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="562" y="182" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="576" y="199.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">&gt;_</text><text x="598" y="176" font-size="13" font-weight="700" fill="#1F2933">Shell on ansible-01</text><text x="598" y="193" font-size="11" fill="#5C6873">ssh ansible-01, account ansible</text><text x="598" y="208" font-size="11" fill="#5C6873">ansible-playbook -e ssh_identity</text><rect x="869" y="156" width="220" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="868" y="154" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><use href="#lg-semaphore" x="878" y="182" width="28" height="28"/><text x="914" y="176" font-size="13" font-weight="700" fill="#1F2933">Semaphore 2.18.27</text><text x="914" y="193" font-size="11" fill="#5C6873">TCP 3000 · click-to-run</text><text x="914" y="208" font-size="11" fill="#5C6873">per-identity templates</text><rect x="40" y="312" width="1560" height="144" rx="10" fill="#EEF4FB" stroke="#9CBBE0"/><path d="M50 312h1540a10 10 0 0 1 10 10v20H40v-20a10 10 0 0 1 10 -10z" fill="#9CBBE0" opacity="0.28"/><rect x="1386.86" y="318" width="203.142" height="18" rx="9.0" fill="#1D4F80"/><text x="1488.43" y="330.96" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">/home/ansible/ssh-key-automation</text><text x="52" y="332" font-size="13" font-weight="700" fill="#1D4F80">One run, one identity</text><rect x="53" y="356" width="312" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="52" y="354" width="312" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><use href="#lg-ansible" x="62" y="382" width="28" height="28"/><text x="98" y="376" font-size="13" font-weight="700" fill="#1F2933">Ansible project</text><text x="98" y="393" font-size="11" fill="#5C6873">playbooks: audit, onboard, stage,</text><text x="98" y="408" font-size="11" fill="#5C6873">verify, retire · validator first</text><rect x="461" y="356" width="312" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="460" y="354" width="312" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="470" y="382" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="484" y="399.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">ID</text><text x="506" y="376" font-size="13" font-weight="700" fill="#1F2933">Selected identity file</text><text x="506" y="393" font-size="11" fill="#5C6873">identities/&lt;id&gt;.yml · public key, fingerprint</text><text x="506" y="408" font-size="11" fill="#5C6873">mac, ansible-control, jedi-pc, ubuntu-dev</text><rect x="869" y="356" width="312" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="868" y="354" width="312" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="878" y="382" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="892" y="399.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">16</text><text x="914" y="376" font-size="13" font-weight="700" fill="#1F2933">Identity target allowlist</text><text x="914" y="393" font-size="11" fill="#5C6873">target_hosts, validated against the inventory</text><text x="914" y="408" font-size="11" fill="#5C6873">becomes ssh_identity_runtime_targets</text><rect x="1277" y="356" width="312" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="1276" y="354" width="312" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="1286" y="382" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="1300" y="399.24" font-size="9" font-weight="700" fill="#3D4852" text-anchor="middle">KEY</text><text x="1322" y="376" font-size="13" font-weight="700" fill="#1F2933">Keys on approved hosts</text><text x="1322" y="393" font-size="11" fill="#5C6873">nodes: /etc/pve/priv/authorized_keys</text><text x="1322" y="408" font-size="11" fill="#5C6873">guests: the identity's key store</text><path d="M662 238L662 266Q662 272 656 272L214 272Q208 272 208 278L208 354" fill="none" stroke="#718096" stroke-width="1.6" marker-end="url(#arr-grey)"/><rect x="393.688" y="263" width="82.6246" height="18" rx="9.0" fill="#FFFFFF" stroke="#718096"/><text x="435" y="275.96" font-size="11" font-weight="600" fill="#718096" text-anchor="middle">runs Ansible</text><path d="M978 238L978 290Q978 296 972 296L274 296Q268 296 268 302L268 354" fill="none" stroke="#6B46C1" stroke-width="1.6" marker-end="url(#arr-purple)"/><rect x="538.272" y="287" width="169.457" height="18" rx="9.0" fill="#FFFFFF" stroke="#6B46C1"/><text x="623" y="299.96" font-size="11" font-weight="600" fill="#6B46C1" text-anchor="middle">same playbooks, optional UI</text><path d="M364 396L460 396" fill="none" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><rect x="378.786" y="387" width="66.4289" height="18" rx="9.0" fill="#FFFFFF" stroke="#2B6CB0"/><text x="412" y="399.96" font-size="11" font-weight="600" fill="#2B6CB0" text-anchor="middle">loads one</text><path d="M772 396L868 396" fill="none" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><rect x="776.42" y="387" width="87.1604" height="18" rx="9.0" fill="#FFFFFF" stroke="#2B6CB0"/><text x="820" y="399.96" font-size="11" font-weight="600" fill="#2B6CB0" text-anchor="middle">its hosts only</text><path d="M1180 396L1276 396" fill="none" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><rect x="1176.96" y="387" width="102.085" height="18" rx="9.0" fill="#FFFFFF" stroke="#2B6CB0"/><text x="1228" y="399.96" font-size="11" font-weight="600" fill="#2B6CB0" text-anchor="middle">exact key match</text><rect x="40" y="488" width="18" height="14" rx="3" fill="#EEF4FB" stroke="#9CBBE0"/><text x="64" y="499" font-size="11" fill="#5C6873">the run</text><rect x="116.29758000000001" y="488" width="18" height="14" rx="3" fill="#F4F4F6" stroke="#BEC2CC"/><text x="140.29758" y="499" font-size="11" fill="#5C6873">launch path</text><path d="M216.57978000000003 495h26" stroke="#718096" stroke-width="1.6" marker-end="url(#arr-grey)"/><text x="250.57978000000003" y="499" font-size="11" fill="#5C6873">control</text><path d="M301.57144000000005 495h26" stroke="#6B46C1" stroke-width="1.6" marker-end="url(#arr-purple)"/><text x="335.57144000000005" y="499" font-size="11" fill="#5C6873">Semaphore launches Ansible</text><path d="M503.2214000000001 495h26" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><text x="537.2214000000001" y="499" font-size="11" fill="#5C6873">data the run carries</text><text x="40" y="524" font-size="11" fill="#8B949E">The playbooks act on one selected identity at a time, so rotating one device never touches any other identity. Comparison and removal use the key algorithm plus the encoded public key, never the comment.</text><text x="40" y="540" font-size="11" fill="#8B949E">Source: Platforms/Ansible/Documentation/Architecture.md, Platforms/Ansible/Source/ssh-key-automation/README.md, Platforms/Ansible/Source/ssh-key-automation/inventory/hosts.yml</text></svg>