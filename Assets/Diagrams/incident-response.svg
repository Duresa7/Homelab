<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="784" viewBox="0 0 1640 784" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B6CB0"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C05621"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C53030"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F855A"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B46C1"/></marker><marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2C7A7B"/></marker></defs><rect width="1640" height="784" fill="#FFFFFF"/><text x="40" y="58" font-size="22" font-weight="700" fill="#1F2933">Security incident response: six steps to close</text><text x="40" y="80" font-size="13" fill="#5C6873">Scope and timeline before any change, contain the live path, correct and rotate, verify that the old path fails, then record residual risk and close</text><rect x="1466.16" y="44" width="133.835" height="18" rx="9.0" fill="#EEF1F4"/><text x="1533.08" y="56.96" font-size="11" font-weight="600" fill="#3D4852" text-anchor="middle">State as of 2026-09-25</text><rect x="40" y="112" width="860" height="144" rx="10" fill="#EEF4FB" stroke="#9CBBE0"/><path d="M50 112h840a10 10 0 0 1 10 10v20H40v-20a10 10 0 0 1 10 -10z" fill="#9CBBE0" opacity="0.28"/><rect x="804.122" y="118" width="85.8778" height="18" rx="9.0" fill="#1D4F80"/><text x="847.061" y="130.96" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">steps 1 and 2</text><text x="52" y="132" font-size="13" font-weight="700" fill="#1D4F80">Understand, before changing state</text><rect x="53" y="156" width="358" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="52" y="154" width="358" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="62" y="182" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="76" y="199.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">1</text><text x="98" y="176" font-size="13" font-weight="700" fill="#1F2933">Scope and impact</text><text x="98" y="193" font-size="11" fill="#5C6873">affected assets, start time, symptom, user impact</text><text x="98" y="208" font-size="11" fill="#5C6873">confirmed facts kept apart from hypotheses</text><rect x="531" y="156" width="358" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="530" y="154" width="358" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="540" y="182" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="554" y="199.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">2</text><text x="576" y="176" font-size="13" font-weight="700" fill="#1F2933">Preserve the timeline</text><text x="576" y="193" font-size="11" fill="#5C6873">provider, service, DNS, firewall and auth events</text><text x="576" y="208" font-size="11" fill="#5C6873">plus my own actions, in order, time zone kept</text><rect x="924" y="112" width="676" height="144" rx="10" fill="#F4F4F6" stroke="#BEC2CC"/><path d="M934 112h656a10 10 0 0 1 10 10v20H924v-20a10 10 0 0 1 10 -10z" fill="#BEC2CC" opacity="0.28"/><text x="936" y="132" font-size="13" font-weight="700" fill="#4A4F5A">What you need</text><text x="936" y="166" font-size="11" fill="#5C6873">the first observed time, the affected service, the symptom and the reporter</text><text x="936" y="182" font-size="11" fill="#5C6873">provider dashboards, service logs, DNS, firewall and authentication records</text><text x="936" y="198" font-size="11" fill="#5C6873">every system that can reach or trust the affected component</text><text x="936" y="214" font-size="11" fill="#5C6873">a copy of each configuration file before editing it; there are no snapshots</text><text x="936" y="230" font-size="11" fill="#5C6873">or backups, so a rebuild from the baseline is the fallback beyond that</text><rect x="40" y="312" width="880" height="144" rx="10" fill="#FFF2E3" stroke="#EDB578"/><path d="M50 312h860a10 10 0 0 1 10 10v20H40v-20a10 10 0 0 1 10 -10z" fill="#EDB578" opacity="0.28"/><rect x="824.122" y="318" width="85.8778" height="18" rx="9.0" fill="#8A4B0E"/><text x="867.061" y="330.96" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">steps 3 and 4</text><text x="52" y="332" font-size="13" font-weight="700" fill="#8A4B0E">Contain, then correct</text><rect x="53" y="356" width="368" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="52" y="354" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="62" y="382" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="76" y="399.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">3</text><text x="98" y="376" font-size="13" font-weight="700" fill="#1F2933">Contain the active path</text><text x="98" y="393" font-size="11" fill="#5C6873">disable the exposed route, account, tunnel or key</text><text x="98" y="408" font-size="11" fill="#5C6873">the narrowest action that stops it and keeps the evidence</text><rect x="541" y="356" width="368" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="540" y="354" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="550" y="382" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="564" y="399.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">4</text><text x="586" y="376" font-size="13" font-weight="700" fill="#1F2933">Correct the configuration</text><text x="586" y="393" font-size="11" fill="#5C6873">rotate access, remove legacy entries, repair the target</text><text x="586" y="408" font-size="11" fill="#5C6873">update each dependent service</text><rect x="944" y="312" width="656" height="144" rx="10" fill="#FCEDEC" stroke="#E4A2A0"/><path d="M954 312h636a10 10 0 0 1 10 10v20H944v-20a10 10 0 0 1 10 -10z" fill="#E4A2A0" opacity="0.28"/><text x="956" y="332" font-size="13" font-weight="700" fill="#8E2622">If containment increases impact</text><text x="956" y="366" font-size="11" fill="#5C6873">restore the last known-good service route while keeping the exposed</text><text x="956" y="382" font-size="11" fill="#5C6873">identity disabled; split availability recovery from the security</text><text x="956" y="398" font-size="11" fill="#5C6873">correction when one rollback cannot safely restore both</text><rect x="40" y="512" width="864" height="144" rx="10" fill="#EAF6EE" stroke="#93CBA3"/><path d="M50 512h844a10 10 0 0 1 10 10v20H40v-20a10 10 0 0 1 10 -10z" fill="#93CBA3" opacity="0.28"/><rect x="808.122" y="518" width="85.8778" height="18" rx="9.0" fill="#1F5C31"/><text x="851.061" y="530.96" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">steps 5 and 6</text><text x="52" y="532" font-size="13" font-weight="700" fill="#1F5C31">Prove it, then close</text><rect x="53" y="556" width="360" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="52" y="554" width="360" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="62" y="582" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="76" y="599.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">5</text><text x="98" y="576" font-size="13" font-weight="700" fill="#1F2933">Verify service and security state</text><text x="98" y="593" font-size="11" fill="#5C6873">user path, backend, auth, DNS, provider status</text><text x="98" y="608" font-size="11" fill="#5C6873">the old value or route must fail after the new one works</text><rect x="533" y="556" width="360" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="532" y="554" width="360" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="542" y="582" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="556" y="599.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">6</text><text x="578" y="576" font-size="13" font-weight="700" fill="#1F2933">Record residual risk and close</text><text x="578" y="593" font-size="11" fill="#5C6873">each follow-up with the condition that closes it</text><text x="578" y="608" font-size="11" fill="#5C6873">close only when stable, path disabled, results recorded</text><rect x="928" y="512" width="672" height="144" rx="10" fill="#F4F4F6" stroke="#BEC2CC"/><path d="M938 512h652a10 10 0 0 1 10 10v20H928v-20a10 10 0 0 1 10 -10z" fill="#BEC2CC" opacity="0.28"/><text x="940" y="532" font-size="13" font-weight="700" fill="#4A4F5A">The report, under Security/Incidents/&lt;Service&gt;/</text><text x="940" y="566" font-size="11" fill="#5C6873">metadata (date, service, closure status), summary, impact, affected assets,</text><text x="940" y="582" font-size="11" fill="#5C6873">symptoms with exact error text, timeline, findings and the root cause or</text><text x="940" y="598" font-size="11" fill="#5C6873">the standing hypothesis, corrective action with its validation, residual</text><text x="940" y="614" font-size="11" fill="#5C6873">risk and follow-ups; kept apart from the platform's records, cross-linked.</text><text x="940" y="630" font-size="11" fill="#5C6873">Thirteen reports in eleven service folders on 2026-09-25.</text><path d="M410 196L530 196" fill="none" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><rect x="437.759" y="187" width="64.4817" height="18" rx="9.0" fill="#FFFFFF" stroke="#2B6CB0"/><text x="470" y="199.96" font-size="11" font-weight="600" fill="#2B6CB0" text-anchor="middle">facts first</text><path d="M420 396L540 396" fill="none" stroke="#C05621" stroke-width="1.6" marker-end="url(#arr-orange)"/><rect x="451.327" y="387" width="57.3457" height="18" rx="9.0" fill="#FFFFFF" stroke="#C05621"/><text x="480" y="399.96" font-size="11" font-weight="600" fill="#C05621" text-anchor="middle">path cut</text><path d="M412 596L532 596" fill="none" stroke="#2F855A" stroke-width="1.6" marker-end="url(#arr-green)"/><rect x="430.041" y="587" width="83.9189" height="18" rx="9.0" fill="#FFFFFF" stroke="#2F855A"/><text x="472" y="599.96" font-size="11" font-weight="600" fill="#2F855A" text-anchor="middle">old path fails</text><path d="M470 256L470 278Q470 284 476 284L484 284Q490 284 490 290L490 312" fill="none" stroke="#718096" stroke-width="1.6" marker-end="url(#arr-grey)"/><rect x="327.613" y="275" width="284.774" height="18" rx="9.0" fill="#FFFFFF" stroke="#718096"/><text x="470" y="287.96" font-size="11" font-weight="600" fill="#718096" text-anchor="middle">facts and timeline recorded; nothing changed yet</text><path d="M480 456L480 478Q480 484 474 484L470 484Q464 484 464 490L464 512" fill="none" stroke="#718096" stroke-width="1.6" marker-end="url(#arr-grey)"/><rect x="329.171" y="475" width="301.658" height="18" rx="9.0" fill="#FFFFFF" stroke="#718096"/><text x="480" y="487.96" font-size="11" font-weight="600" fill="#718096" text-anchor="middle">the new value works and the exposed path is closed</text><rect x="40" y="688" width="18" height="14" rx="3" fill="#EEF4FB" stroke="#9CBBE0"/><text x="64" y="699" font-size="11" fill="#5C6873">understand</text><rect x="138.33498" y="688" width="18" height="14" rx="3" fill="#FCEDEC" stroke="#E4A2A0"/><text x="162.33498" y="699" font-size="11" fill="#5C6873">when containment makes it worse</text><rect x="353.94624" y="688" width="18" height="14" rx="3" fill="#FFF2E3" stroke="#EDB578"/><text x="377.94624" y="699" font-size="11" fill="#5C6873">act</text><rect x="409.50068" y="688" width="18" height="14" rx="3" fill="#EAF6EE" stroke="#93CBA3"/><text x="433.50068" y="699" font-size="11" fill="#5C6873">prove and close</text><rect x="531.80862" y="688" width="18" height="14" rx="3" fill="#F4F4F6" stroke="#BEC2CC"/><text x="555.80862" y="699" font-size="11" fill="#5C6873">inputs and the output</text><path d="M680.71302 695h26" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><text x="714.71302" y="699" font-size="11" fill="#5C6873">next step</text><path d="M778.0293 695h26" stroke="#C05621" stroke-width="1.6" marker-end="url(#arr-orange)"/><text x="812.0293" y="699" font-size="11" fill="#5C6873">guarded transition</text><path d="M921.35594 695h26" stroke="#718096" stroke-width="1.6" marker-end="url(#arr-grey)"/><text x="955.35594" y="699" font-size="11" fill="#5C6873">gate to the next row</text><text x="40" y="724" font-size="11" fill="#8B949E">A corrective action counts only with an observed result, never a submitted command. Routine troubleshooting is not an incident and stays with the platform that owns it; when a problem becomes one, the report and the platform record link each other.</text><text x="40" y="740" font-size="11" fill="#8B949E">This sequence does not replace a provider's own procedure. A disclosure that touches billing, legal notice or third-party user data needs the external response path as well as the technical record.</text><text x="40" y="756" font-size="11" fill="#8B949E">Source: Guides/Security-Incident-Response.md, Security/README.md</text></svg>