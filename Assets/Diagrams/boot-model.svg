<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="768" viewBox="0 0 1400 768" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><defs><symbol id="lg-proxmox" viewBox="0 0 24 24"><image width="24" height="24" href="data:image/svg+xml;base64,"/></symbol><symbol id="lg-semaphore" viewBox="0 0 24 24"><image width="24" height="24" href="data:image/svg+xml;base64,"/></symbol><symbol id="lg-ansible" viewBox="0 0 24 24"><image width="24" height="24" href="data:image/svg+xml;base64,"/></symbol><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B6CB0"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C05621"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C53030"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F855A"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B46C1"/></marker><marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2C7A7B"/></marker></defs><rect width="1400" height="768" fill="#FFFFFF"/><text x="40" y="58" font-size="22" font-weight="700" fill="#1F2933">Controller boot model: LXC 100 to Semaphore and the PXE services</text><text x="40" y="80" font-size="13" fill="#5C6873">blue-server boots, Proxmox starts ansible-01 with onboot=1, systemd brings up three units, and every task resolves into /opt/ansible-current</text><rect x="1226.16" y="44" width="133.835" height="18" rx="9.0" fill="#EEF1F4"/><text x="1293.08" y="56.96" font-size="11" font-weight="600" fill="#3D4852" text-anchor="middle">State as of 2026-09-24</text><rect x="40" y="112" width="1320" height="144" rx="10" fill="#EEF2F4" stroke="#A9B7C3"/><path d="M50 112h1300a10 10 0 0 1 10 10v20H40v-20a10 10 0 0 1 10 -10z" fill="#A9B7C3" opacity="0.28"/><rect x="1246" y="118" width="103.997" height="18" rx="9.0" fill="#33434F"/><text x="1298" y="130.96" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">no operator step</text><text x="52" y="132" font-size="13" font-weight="700" fill="#33434F">Boot chain</text><rect x="53" y="156" width="368" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="52" y="154" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><path d="M60 154.5a8 8 0 0 0 -8 8v68a8 8 0 0 0 8 8z" fill="#1D5FB0"/><use href="#lg-proxmox" x="62" y="182" width="28" height="28"/><text x="98" y="176" font-size="13" font-weight="700" fill="#1F2933">blue-server boots</text><text x="98" y="193" font-size="11" fill="#5C6873">Proxmox VE 9.2.11 · 192.168.70.12</text><text x="98" y="208" font-size="11" fill="#5C6873">pct config 100: onboot: 1</text><rect x="517" y="156" width="368" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="516" y="154" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><path d="M524 154.5a8 8 0 0 0 -8 8v68a8 8 0 0 0 8 8z" fill="#1D5FB0"/><rect x="526" y="182" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="540" y="199.24" font-size="9" font-weight="700" fill="#3D4852" text-anchor="middle">LXC</text><text x="562" y="176" font-size="13" font-weight="700" fill="#1F2933">LXC 100 ansible-01 starts</text><text x="562" y="193" font-size="11" fill="#5C6873">192.168.40.36 · Personal-A VLAN 40</text><text x="562" y="208" font-size="11" fill="#5C6873">systemd inside the container</text><rect x="981" y="156" width="368" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="980" y="154" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="990" y="182" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="1004" y="199.24" font-size="9" font-weight="700" fill="#3D4852" text-anchor="middle">init</text><text x="1026" y="176" font-size="13" font-weight="700" fill="#1F2933">systemd starts three units</text><text x="1026" y="193" font-size="11" fill="#5C6873">all enabled, active after every boot</text><text x="1026" y="208" font-size="11" fill="#5C6873">Semaphore: Restart=on-failure, 5 s</text><rect x="40" y="312" width="1320" height="144" rx="10" fill="#EEF4FB" stroke="#9CBBE0"/><path d="M50 312h1300a10 10 0 0 1 10 10v20H40v-20a10 10 0 0 1 10 -10z" fill="#9CBBE0" opacity="0.28"/><rect x="1290.04" y="318" width="59.9576" height="18" rx="9.0" fill="#1D4F80"/><text x="1320.02" y="330.96" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">listeners</text><text x="52" y="332" font-size="13" font-weight="700" fill="#1D4F80">Services inside ansible-01</text><rect x="53" y="356" width="368" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="52" y="354" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><use href="#lg-semaphore" x="62" y="382" width="28" height="28"/><text x="98" y="376" font-size="13" font-weight="700" fill="#1F2933">semaphore.service</text><text x="98" y="393" font-size="11" fill="#5C6873">Semaphore 2.18.27 · TCP 3000</text><text x="98" y="408" font-size="11" fill="#5C6873">PATH /opt/ansible-current/bin first · C.utf8</text><rect x="517" y="356" width="368" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="516" y="354" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="526" y="382" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="540" y="399.24" font-size="9" font-weight="700" fill="#3D4852" text-anchor="middle">PXE</text><text x="562" y="376" font-size="13" font-weight="700" fill="#1F2933">galaxy-pxe.service</text><text x="562" y="393" font-size="11" fill="#5C6873">HTTP TCP 8080 · answers and callbacks</text><text x="562" y="408" font-size="11" fill="#5C6873">state /var/lib/galaxy-pxe/state.json</text><rect x="981" y="356" width="368" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="980" y="354" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#B7791F"/><rect x="990" y="382" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="1004" y="399.24" font-size="9" font-weight="700" fill="#3D4852" text-anchor="middle">TFTP</text><text x="1026" y="376" font-size="13" font-weight="700" fill="#1F2933">tftpd-hpa.service</text><text x="1026" y="393" font-size="11" fill="#5C6873">UDP 69 · root /srv/tftp</text><text x="1026" y="408" font-size="11" fill="#5C6873">first request after a restart times out</text><rect x="40" y="512" width="1320" height="144" rx="10" fill="#F4F4F6" stroke="#BEC2CC"/><path d="M50 512h1300a10 10 0 0 1 10 10v20H40v-20a10 10 0 0 1 10 -10z" fill="#BEC2CC" opacity="0.28"/><rect x="1193.52" y="518" width="156.479" height="18" rx="9.0" fill="#4A4F5A"/><text x="1271.76" y="530.96" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">no daemon for direct runs</text><text x="52" y="532" font-size="13" font-weight="700" fill="#4A4F5A">What they resolve into</text><rect x="53" y="556" width="368" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="52" y="554" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><use href="#lg-ansible" x="62" y="582" width="28" height="28"/><text x="98" y="576" font-size="13" font-weight="700" fill="#1F2933">/opt/ansible-current</text><text x="98" y="593" font-size="11" fill="#5C6873">Ansible 14.2.0 · ansible-core 2.21.2</text><text x="98" y="608" font-size="11" fill="#5C6873">/usr/local/bin/ansible* link into it</text><rect x="517" y="556" width="368" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="516" y="554" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="526" y="582" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="540" y="599.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">5</text><text x="562" y="576" font-size="13" font-weight="700" fill="#1F2933">PXE lane · Server-Provision VLAN 5</text><text x="562" y="593" font-size="11" fill="#5C6873">UEFI PXE at 192.168.40.36, galaxy-ipxe.efi</text><text x="562" y="608" font-size="11" fill="#5C6873">one-use claim, answer per registered MAC</text><rect x="981" y="556" width="368" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="980" y="554" width="368" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><path d="M988 554.5a8 8 0 0 0 -8 8v68a8 8 0 0 0 8 8z" fill="#495057"/><use href="#lg-proxmox" x="990" y="582" width="28" height="28"/><text x="1026" y="576" font-size="13" font-weight="700" fill="#1F2933">Cluster join through grey-server</text><text x="1026" y="593" font-size="11" fill="#5C6873">first boot fetches the dedicated join key</text><text x="1026" y="608" font-size="11" fill="#5C6873">pvecm add --use_ssh · scope: this join only</text><path d="M420 196L516 196" fill="none" stroke="#718096" stroke-width="1.6" marker-end="url(#arr-grey)"/><rect x="446.125" y="187" width="43.7502" height="18" rx="9.0" fill="#FFFFFF" stroke="#718096"/><text x="468" y="199.96" font-size="11" font-weight="600" fill="#718096" text-anchor="middle">starts</text><path d="M884 196L980 196" fill="none" stroke="#718096" stroke-width="1.6" marker-end="url(#arr-grey)"/><rect x="910.131" y="187" width="43.7385" height="18" rx="9.0" fill="#FFFFFF" stroke="#718096"/><text x="932" y="199.96" font-size="11" font-weight="600" fill="#718096" text-anchor="middle">boots</text><path d="M1164 238L1164 290Q1164 296 1158 296L242 296Q236 296 236 302L236 354" fill="none" stroke="#718096" stroke-width="1.6" marker-end="url(#arr-grey)"/><path d="M1164 238L1164 290Q1164 296 1158 296L706 296Q700 296 700 302L700 354" fill="none" stroke="#718096" stroke-width="1.6" marker-end="url(#arr-grey)"/><path d="M1164 238L1164 354" fill="none" stroke="#718096" stroke-width="1.6" marker-end="url(#arr-grey)"/><path d="M236 438L236 554" fill="none" stroke="#6B46C1" stroke-width="1.6" marker-end="url(#arr-purple)"/><rect x="203.427" y="475" width="65.1463" height="18" rx="9.0" fill="#FFFFFF" stroke="#6B46C1"/><text x="236" y="487.96" font-size="11" font-weight="600" fill="#6B46C1" text-anchor="middle">tasks use</text><path d="M700 438L700 554" fill="none" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><rect x="603.594" y="475" width="192.812" height="18" rx="9.0" fill="#FFFFFF" stroke="#2B6CB0"/><text x="700" y="487.96" font-size="11" font-weight="600" fill="#2B6CB0" text-anchor="middle">serves the answer, records state</text><path d="M1164 438L1164 490Q1164 496 1158 496L816 496Q810 496 810 502L810 554" fill="none" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><rect x="1100.66" y="475" width="126.676" height="18" rx="9.0" fill="#FFFFFF" stroke="#2B6CB0"/><text x="1164" y="487.96" font-size="11" font-weight="600" fill="#2B6CB0" text-anchor="middle">hands out the loader</text><path d="M884 596L980 596" fill="none" stroke="#2C7A7B" stroke-width="1.6" marker-end="url(#arr-teal)"/><rect x="904.289" y="587" width="55.4218" height="18" rx="9.0" fill="#FFFFFF" stroke="#2C7A7B"/><text x="932" y="599.96" font-size="11" font-weight="600" fill="#2C7A7B" text-anchor="middle">join key</text><rect x="40" y="688" width="18" height="14" rx="3" fill="#EEF4FB" stroke="#9CBBE0"/><text x="64" y="699" font-size="11" fill="#5C6873">systemd units</text><rect x="151.27758" y="688" width="18" height="14" rx="3" fill="#EEF2F4" stroke="#A9B7C3"/><text x="175.27758" y="699" font-size="11" fill="#5C6873">Proxmox node and guest</text><rect x="320.9018" y="688" width="18" height="14" rx="3" fill="#F4F4F6" stroke="#BEC2CC"/><text x="344.9018" y="699" font-size="11" fill="#5C6873">runtime and lane</text><path d="M447.74548 695h26" stroke="#718096" stroke-width="1.6" marker-end="url(#arr-grey)"/><text x="481.74548" y="699" font-size="11" fill="#5C6873">boot order</text><path d="M550.89176 695h26" stroke="#6B46C1" stroke-width="1.6" marker-end="url(#arr-purple)"/><text x="584.89176" y="699" font-size="11" fill="#5C6873">Semaphore tasks</text><path d="M691.61822 695h26" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><text x="725.61822" y="699" font-size="11" fill="#5C6873">PXE path</text><path d="M790.88172 695h26" stroke="#2C7A7B" stroke-width="1.6" marker-end="url(#arr-teal)"/><text x="824.88172" y="699" font-size="11" fill="#5C6873">first boot of a new node</text><rect x="962.08742" y="688" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="962.08742" y="688" width="5" height="14" rx="2" fill="#1D5FB0"/><text x="986.08742" y="699" font-size="11" fill="#5C6873">blue-server</text><rect x="1060.39908" y="688" width="18" height="14" rx="3" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="1060.39908" y="688" width="5" height="14" rx="2" fill="#495057"/><text x="1084.39908" y="699" font-size="11" fill="#5C6873">grey-server</text><text x="40" y="724" font-size="11" fill="#8B949E">The web UI returns on its own after a controller or node reboot. Direct ansible-playbook runs need no service and work as soon as the LXC is up. The tftpd-hpa first-request timeout is open since 2026-09-12; the transfer succeeds on retry.</text><text x="40" y="740" font-size="11" fill="#8B949E">Source: Platforms/Ansible/README.md, Platforms/Ansible/Documentation/Architecture.md, Platforms/Ansible/Configuration/semaphore.service, Platforms/Galaxy PXE/README.md, Platforms/Galaxy PXE/Source/README.md, Operations/Inventory/Galaxy/Services.md</text></svg>