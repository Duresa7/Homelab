<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="568" viewBox="0 0 1640 568" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B6CB0"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C05621"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C53030"/></marker><marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F855A"/></marker><marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B46C1"/></marker><marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2C7A7B"/></marker></defs><rect width="1640" height="568" fill="#FFFFFF"/><text x="40" y="58" font-size="22" font-weight="700" fill="#1F2933">Key rotation state machine (one identity)</text><text x="40" y="80" font-size="13" fill="#5C6873">Five states of one identities/&lt;id&gt;.yml file; the removal gate opens only when every condition below holds</text><rect x="1466.16" y="44" width="133.835" height="18" rx="9.0" fill="#EEF1F4"/><text x="1533.08" y="56.96" font-size="11" font-weight="600" fill="#3D4852" text-anchor="middle">State as of 2026-09-24</text><rect x="40" y="112" width="1560" height="144" rx="10" fill="#EEF4FB" stroke="#9CBBE0"/><path d="M50 112h1540a10 10 0 0 1 10 10v20H40v-20a10 10 0 0 1 10 -10z" fill="#9CBBE0" opacity="0.28"/><rect x="1476.25" y="118" width="113.745" height="18" rx="9.0" fill="#1D4F80"/><text x="1533.13" y="130.96" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">identities/&lt;id&gt;.yml</text><text x="52" y="132" font-size="13" font-weight="700" fill="#1D4F80">Rotation of one identity</text><rect x="53" y="156" width="230.4" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="52" y="154" width="230.4" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="62" y="182" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="76" y="199.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">1</text><text x="98" y="176" font-size="13" font-weight="700" fill="#1F2933">Current key only</text><text x="98" y="193" font-size="11" fill="#5C6873">current_public_key, fingerprint</text><text x="98" y="208" font-size="11" fill="#5C6873">no replacement configured</text><rect x="379.4" y="156" width="230.4" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="378.4" y="154" width="230.4" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="388.4" y="182" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="402.4" y="199.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">2</text><text x="424.4" y="176" font-size="13" font-weight="700" fill="#1F2933">Replacement configured</text><text x="424.4" y="193" font-size="11" fill="#5C6873">replacement_public_key set</text><text x="424.4" y="208" font-size="11" fill="#5C6873">made on the owner device</text><rect x="705.8" y="156" width="230.4" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="704.8" y="154" width="230.4" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="714.8" y="182" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="728.8" y="199.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">3</text><text x="750.8" y="176" font-size="13" font-weight="700" fill="#1F2933">Both keys present</text><text x="750.8" y="193" font-size="11" fill="#5C6873">ssh-key-stage.yml, additive</text><text x="750.8" y="208" font-size="11" fill="#5C6873">old and new on every target</text><rect x="1032.2" y="156" width="230.4" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="1031.2" y="154" width="230.4" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="1041.2" y="182" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="1055.2" y="199.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">4</text><text x="1077.2" y="176" font-size="13" font-weight="700" fill="#1F2933">Verified</text><text x="1077.2" y="193" font-size="11" fill="#5C6873">verify play, then a login test</text><text x="1077.2" y="208" font-size="11" fill="#5C6873">operator_verified: true</text><rect x="1358.6" y="156" width="230.4" height="84" rx="8" fill="#000" opacity="0.05"/><rect x="1357.6" y="154" width="230.4" height="84" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/><rect x="1367.6" y="182" width="28" height="28" rx="6" fill="#EEF1F4" stroke="#D0D7DE"/><text x="1381.6" y="199.96" font-size="11" font-weight="700" fill="#3D4852" text-anchor="middle">5</text><text x="1403.6" y="176" font-size="13" font-weight="700" fill="#1F2933">Old key removed</text><text x="1403.6" y="193" font-size="11" fill="#5C6873">ssh-key-retire.yml</text><text x="1403.6" y="208" font-size="11" fill="#5C6873">phrase RETIRE &lt;identity-id&gt;</text><rect x="40" y="312" width="852" height="144" rx="10" fill="#FFF2E3" stroke="#EDB578"/><path d="M50 312h832a10 10 0 0 1 10 10v20H40v-20a10 10 0 0 1 10 -10z" fill="#EDB578" opacity="0.28"/><text x="52" y="332" font-size="13" font-weight="700" fill="#8A4B0E">Removal gate: all five must hold</text><text x="52" y="366" font-size="11" fill="#5C6873">a distinct replacement public key is configured</text><text x="52" y="382" font-size="11" fill="#5C6873">both old and replacement keys are present on every selected target</text><text x="52" y="398" font-size="11" fill="#5C6873">the replacement was tested from the owner device and operator_verified is true</text><text x="52" y="414" font-size="11" fill="#5C6873">the exact phrase RETIRE &lt;identity-id&gt; is supplied</text><text x="52" y="430" font-size="11" fill="#5C6873">every selected target is reachable; one offline host blocks the whole removal</text><rect x="916" y="312" width="684" height="144" rx="10" fill="#F4F4F6" stroke="#BEC2CC"/><path d="M926 312h664a10 10 0 0 1 10 10v20H916v-20a10 10 0 0 1 10 -10z" fill="#BEC2CC" opacity="0.28"/><text x="928" y="332" font-size="13" font-weight="700" fill="#4A4F5A">After retirement, in the identity file</text><text x="928" y="366" font-size="11" fill="#5C6873">promote the replacement to current_public_key</text><text x="928" y="382" font-size="11" fill="#5C6873">update fingerprint</text><text x="928" y="398" font-size="11" fill="#5C6873">clear replacement_public_key</text><text x="928" y="414" font-size="11" fill="#5C6873">reset operator_verified to false</text><text x="928" y="430" font-size="11" fill="#5C6873">rerun the validator and the audit</text><path d="M282.4 196L378.4 196" fill="none" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><rect x="281.305" y="187" width="98.1907" height="18" rx="9.0" fill="#FFFFFF" stroke="#2B6CB0"/><text x="330.4" y="199.96" font-size="11" font-weight="600" fill="#2B6CB0" text-anchor="middle">supply new key</text><path d="M608.8 196L704.8 196" fill="none" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><rect x="635.572" y="187" width="42.4559" height="18" rx="9.0" fill="#FFFFFF" stroke="#2B6CB0"/><text x="656.8" y="199.96" font-size="11" font-weight="600" fill="#2B6CB0" text-anchor="middle">stage</text><path d="M935.2 196L1031.2 196" fill="none" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><rect x="944.634" y="187" width="77.1328" height="18" rx="9.0" fill="#FFFFFF" stroke="#2B6CB0"/><text x="983.2" y="199.96" font-size="11" font-weight="600" fill="#2B6CB0" text-anchor="middle">verify + test</text><path d="M1261.6 196L1357.6 196" fill="none" stroke="#C05621" stroke-width="1.6" marker-end="url(#arr-orange)"/><rect x="1259.22" y="187" width="100.756" height="18" rx="9.0" fill="#FFFFFF" stroke="#C05621"/><text x="1309.6" y="199.96" font-size="11" font-weight="600" fill="#C05621" text-anchor="middle">RETIRE confirm</text><path d="M1472.8 238L1472.8 278Q1472.8 284 1466.8 284L173.2 284Q167.2 284 167.2 278L167.2 238" fill="none" stroke="#6B46C1" stroke-width="1.6" marker-end="url(#arr-purple)"/><rect x="705.148" y="275" width="229.704" height="18" rx="9.0" fill="#FFFFFF" stroke="#6B46C1"/><text x="820" y="287.96" font-size="11" font-weight="600" fill="#6B46C1" text-anchor="middle">promote replacement in the identity file</text><rect x="40" y="488" width="18" height="14" rx="3" fill="#EEF4FB" stroke="#9CBBE0"/><text x="64" y="499" font-size="11" fill="#5C6873">state of the identity file</text><rect x="196.017" y="488" width="18" height="14" rx="3" fill="#FFF2E3" stroke="#EDB578"/><text x="220.017" y="499" font-size="11" fill="#5C6873">gate</text><rect x="258.70736" y="488" width="18" height="14" rx="3" fill="#F4F4F6" stroke="#BEC2CC"/><text x="282.70736" y="499" font-size="11" fill="#5C6873">bookkeeping</text><path d="M364.81956 495h26" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#arr-blue)"/><text x="398.81956" y="499" font-size="11" fill="#5C6873">forward transition</text><path d="M504.24010000000004 495h26" stroke="#C05621" stroke-width="1.6" marker-end="url(#arr-orange)"/><text x="538.2401" y="499" font-size="11" fill="#5C6873">guarded removal</text><path d="M641.72508 495h26" stroke="#6B46C1" stroke-width="1.6" marker-end="url(#arr-purple)"/><text x="675.72508" y="499" font-size="11" fill="#5C6873">back to the start</text><text x="40" y="524" font-size="11" fill="#8B949E">A failed stage leaves the old key installed. A partial retirement is recovered by reinstalling the recorded old key through a surviving credential, then rerunning the audit.</text><text x="40" y="540" font-size="11" fill="#8B949E">Source: Platforms/Ansible/Documentation/Architecture.md, Platforms/Ansible/Source/ssh-key-automation/README.md</text></svg>