name: minecraft

services:
  minecraft:
    image: itzg/minecraft-server:stable-java25
    container_name: minecraft
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "25565:25565/tcp"
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "26.3"
      INIT_MEMORY: "1G"
      MAX_MEMORY: "4G"
      ONLINE_MODE: "TRUE"
      ENABLE_RCON: "FALSE"
      MOTD: "AlphaSec United Minecraft"
      MAX_PLAYERS: "20"
      TZ: "America/New_York"
    volumes:
      - /opt/docker/minecraft/data:/data
    mem_limit: 5g
    memswap_limit: 5g
    stop_grace_period: 2m
    labels:
      dockhand.update: "false"
