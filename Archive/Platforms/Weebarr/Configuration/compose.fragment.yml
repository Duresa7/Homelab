services:
  weebarr:
    image: ghcr.io/deepdaddyttv/weebarr:latest
    container_name: weebarr
    pull_policy: always
    user: "1000:1000"
    environment:
      TZ: America/New_York
      WEEBARR_PUBLIC_URL: https://weebarr.alphasecunited.com
      SEERR_BASE_URL: http://jellyseerr:5055
      SEERR_REQUEST_SEASONS: all
    volumes:
      - /opt/media-stack/config/weebarr:/config
    ports:
      - "18080:8888"
    restart: unless-stopped
    networks: [media]
