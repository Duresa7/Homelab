version: 2
name: homelab
displayName: Homelab MCP Catalog
registry:
  ssh-manager:
    title: SSH Manager
    type: remote
    description: Manage homelab machines over SSH through MCP.
    readme: https://github.com/bvisible/mcp-ssh-manager
    # One persistent mcp-ssh-manager process runs in the ssh-manager Compose service,
    # fronted by mcp-proxy on the project network. The gateway proxies every client
    # session to it, so pooled connections, interactive sessions and history are shared
    # across all callers and no per-session container exists. Plain HTTP on the private
    # Compose network requires DOCKER_MCP_ALLOW_INSECURE_REMOTE_URLS=1 on the gateway.
    # The eighteen server definitions moved to ssh-manager-servers.env and the secrets
    # to the root-owned ssh-manager.env, both read by that service.
    remote:
      url: http://ssh-manager:8080/mcp
      transport_type: streamable-http
    metadata:
      category: automation
      tags:
        - ssh
        - devops
      license: MIT
      owner: bvisible
