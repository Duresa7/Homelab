name: docusaurus

services:
  docusaurus:
    build:
      context: ../Source
      dockerfile: Dockerfile
    image: homelab/docusaurus:3.10.2
    container_name: docusaurus
    restart: unless-stopped
    ports:
      - "3010:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
