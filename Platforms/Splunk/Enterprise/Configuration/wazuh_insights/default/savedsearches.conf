# Searches kept as objects rather than only as dashboard panels, and the
# alerts that hang off them.
#
# A panel answers a question while somebody is looking at it. These are the same
# questions in a form an alert can be attached to. Since 2026-09-03 four of
# them are scheduled and post to Discord through the alert bot's /splunk
# endpoint on monitor-01, which accepts posts from this host only. Splunk is the
# only thing that notifies on Wazuh data; the manager itself stays detection
# only, with no active response. alert.digest_mode = 0 runs the webhook once
# per result row, so a rule grouped by machine is one message per machine and
# the suppression fields apply per machine.
#
# A dashboard panel does not need one of these to pin its time window: Splunk
# substitutes the dispatch range when the search string itself names earliest
# and latest, and says so in the job's messages. The panels rely on that.

[Wazuh - Machines gone quiet]
search = index=wazuh sourcetype=wazuh:alerts | stats max(_time) as last by "agent.name" | where last < relative_time(now(),"-24h") | stats count
dispatch.earliest_time = -7d
dispatch.latest_time = now
description = Agents that reported within the last 7 days but have been silent for 24 hours.
disabled = 0
enableSched = 0

# One stale manager identity remains in the 7-day search window through
# 2026-09-08. The exclusion below matches it only when its last event predates
# 2026-09-02, so it expires on its own and does not hide a later host with the
# same name. Checked hourly; a machine that goes quiet is reported once, and
# the seven-day suppression outlives the seven-day lookback so it is not
# reported again for the same silence.
[Wazuh - Machines gone quiet, listed]
search = index=wazuh sourcetype=wazuh:alerts | stats max(_time) as last count as alerts by "agent.name" | where last < relative_time(now(),"-24h") AND NOT ('agent.name' == "wazuh-01" AND last < strptime("2026-09-02", "%Y-%m-%d")) | eval Silent=tostring(now()-last,"duration"), Last=strftime(last,"%Y-%m-%d %H:%M:%S") | table "agent.name",Last,Silent,alerts | rename "agent.name" as Machine, alerts as "Alerts in 7d" | sort - Silent
dispatch.earliest_time = -7d
dispatch.latest_time = now
description = The same set, named, so the tile can be opened into something actionable. Scheduled since 2026-09-03 and posted to Discord, one message per machine.
disabled = 0
enableSched = 1
cron_schedule = 5 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = Machine
alert.suppress.period = 604800s
alert.digest_mode = 0
alert.track = 1
action.webhook = 1
action.webhook.param.url = http://192.168.73.2:8080/splunk

[Wazuh - Malware or high severity]
search = `wazuh` ("rule.level">=12 OR "data.virustotal.malicious"=1 OR "rule.groups{}"=known_bad_hash OR "rule.groups{}"=trojan OR "rule.groups{}"=rootkit) | stats count, max(_time) as lastTime, values("rule.level") as "rule.level", values("rule.description") as "rule.description", values("syscheck.path") as "syscheck.path", values("data.virustotal.permalink") as permalink by "agent.name", "rule.id" | eval Last=strftime(lastTime,"%Y-%m-%d %H:%M:%S") | fields - lastTime
dispatch.earliest_time = -20m
dispatch.latest_time = now
description = Anything the manager scored at 12 or above, plus a malware verdict at any level: a VirusTotal detection, a local known-bad hash, or a rootcheck trojan or rootkit signature. Level 12 is where Wazuh's own scale turns from "unusual" to "attack", and in 30 days of history only the two EICAR test detections reached it. One message per machine and rule, at most once an hour for the same pair.
disabled = 0
enableSched = 1
cron_schedule = 7-59/15 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 6
alert.suppress = 1
alert.suppress.fields = agent.name,rule.id
alert.suppress.period = 3600s
alert.digest_mode = 0
alert.track = 1
action.webhook = 1
action.webhook.param.url = http://192.168.73.2:8080/splunk

[Wazuh - Account or group changed]
search = `wazuh` "rule.groups{}"=adduser | stats count, max(_time) as lastTime, values("rule.description") as "rule.description", values("rule.id") as "rule.id" by "agent.name" | eval Last=strftime(lastTime,"%Y-%m-%d %H:%M:%S") | fields - lastTime
dispatch.earliest_time = -70m
dispatch.latest_time = now
description = A user or group was added, removed or changed on a machine: the adduser group covers rules 5901 to 5904, which is also where a user being put into sudo or wheel lands. I am the only person who does this, so each message should match something I remember doing. Seven events in 30 days, all mine.
disabled = 0
enableSched = 1
cron_schedule = 57 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = agent.name
alert.suppress.period = 3600s
alert.digest_mode = 0
alert.track = 1
action.webhook = 1
action.webhook.param.url = http://192.168.73.2:8080/splunk

[Wazuh - Login from outside private networks]
search = `wazuh` "rule.groups{}"=authentication_success | where isnotnull('data.srcip') AND NOT (cidrmatch("10.0.0.0/8", 'data.srcip') OR cidrmatch("172.16.0.0/12", 'data.srcip') OR cidrmatch("192.168.0.0/16", 'data.srcip') OR cidrmatch("127.0.0.0/8", 'data.srcip') OR 'data.srcip'="::1" OR cidrmatch("fe80::/10", 'data.srcip') OR cidrmatch("fc00::/7", 'data.srcip')) | stats count, max(_time) as lastTime, values("data.dstuser") as user, values("rule.description") as "rule.description" by "agent.name", "data.srcip" | rename "data.srcip" as src | eval Last=strftime(lastTime,"%Y-%m-%d %H:%M:%S") | fields - lastTime
dispatch.earliest_time = -70m
dispatch.latest_time = now
description = A successful login whose source address is not private, loopback or link-local. Every login on record comes from inside the lab or over the VPN's 10.0.1.0/24, so this should never fire; when it does, it is either a new remote path I set up and forgot, or somebody else.
disabled = 0
enableSched = 1
cron_schedule = 2 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 6
alert.suppress = 1
alert.suppress.fields = agent.name,src
alert.suppress.period = 86400s
alert.digest_mode = 0
alert.track = 1
action.webhook = 1
action.webhook.param.url = http://192.168.73.2:8080/splunk
