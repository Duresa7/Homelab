# Searches kept as objects rather than only as dashboard panels.
#
# A panel answers a question while somebody is looking at it. These are the same
# questions in a form an alert can be attached to, which is the next piece of
# work on this platform and the reason they exist before any alert does.
#
# A dashboard panel does not need one of these to pin its time window: Splunk
# substitutes the dispatch range when the search string itself names earliest
# and latest, and says so in the job's messages. The panels rely on that.

[Wazuh - Machines gone quiet]
search = index=wazuh sourcetype=wazuh:alerts | stats max(_time) as last by "agent.name" | where last < relative_time(now(),"-24h") | stats count
dispatch.earliest_time = -7d
dispatch.latest_time = now
description = Agents that reported within the last 7 days but have been silent for 24 hours.
disabled = 0
enableSched = 0

[Wazuh - Machines gone quiet, listed]
search = index=wazuh sourcetype=wazuh:alerts | stats max(_time) as last count as alerts by "agent.name" | where last < relative_time(now(),"-24h") | eval Silent=tostring(now()-last,"duration"), Last=strftime(last,"%Y-%m-%d %H:%M:%S") | table "agent.name",Last,Silent,alerts | rename "agent.name" as Machine, alerts as "Alerts in 7d" | sort - Silent
dispatch.earliest_time = -7d
dispatch.latest_time = now
description = The same set, named, so the tile can be opened into something actionable.
disabled = 0
enableSched = 0
