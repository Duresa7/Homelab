# Shared base searches, so a dashboard panel and a future correlation search
# cannot drift apart on what counts as a login or a watched-file change.

[wazuh]
definition = index=wazuh sourcetype=wazuh:alerts
iseval = 0

[wazuh_logins]
definition = index=wazuh sourcetype=wazuh:alerts ("rule.groups{}"=authentication_success OR "rule.groups{}"=authentication_failed OR "rule.groups{}"=authentication_failures OR "rule.groups{}"=invalid_login)
iseval = 0

[wazuh_file_changes]
definition = index=wazuh sourcetype=wazuh:alerts "rule.groups{}"=syscheck
iseval = 0

[wazuh_malware_found]
definition = index=wazuh sourcetype=wazuh:alerts ("data.virustotal.malicious"=1 OR "rule.groups{}"=known_bad_hash OR "rule.groups{}"=trojan OR "rule.groups{}"=rootkit)
iseval = 0

[wazuh_package_changes]
definition = index=wazuh sourcetype=wazuh:alerts ("rule.groups{}"=dpkg OR "rule.groups{}"=rpm OR "rule.groups{}"=syscollector)
iseval = 0

# The set of machines that should be reporting. Read from the data rather than
# hard-coded, so enrolling an agent does not require editing a dashboard.
[wazuh_expected_agents]
definition = index=wazuh sourcetype=wazuh:alerts earliest=-7d | stats count by "agent.name"
iseval = 0
