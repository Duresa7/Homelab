# CIM tagging.
#
# Authentication takes the sshd, PAM and sudo outcomes. Change takes both the
# file-integrity events and the package installs, which is the pair that answers
# "what changed on this machine". Malware takes the VirusTotal verdicts and the
# manager's own rootcheck findings. Alert takes the high-severity feed.

[eventtype=wazuh_auth_success]
authentication = enabled

[eventtype=wazuh_auth_failure]
authentication = enabled

[eventtype=wazuh_fim]
change = enabled
endpoint = enabled
filesystem = enabled

[eventtype=wazuh_package_change]
change = enabled
endpoint = enabled

[eventtype=wazuh_malware]
malware = enabled
attack = enabled

[eventtype=wazuh_agent_state]
change = enabled
endpoint = enabled

[eventtype=wazuh_high_severity]
alert = enabled
