# Event classes the CIM tags in tags.conf attach to.
#
# Wazuh classifies with rule.groups, a multivalue field, rather than with a
# numeric class the way UniFi's CEF does. Matching on groups rather than on
# rule IDs is what keeps these stable: rule IDs change between Wazuh releases
# and when a local rule overrides a stock one, group names do not.

[wazuh_all]
search = index=wazuh sourcetype=wazuh:alerts

# Authentication: sshd, PAM, sudo, and any decoder that sets these groups.
[wazuh_auth_success]
search = index=wazuh sourcetype=wazuh:alerts "rule.groups{}"=authentication_success

[wazuh_auth_failure]
search = index=wazuh sourcetype=wazuh:alerts ("rule.groups{}"=authentication_failed OR "rule.groups{}"=authentication_failures OR "rule.groups{}"=invalid_login OR "rule.groups{}"=win_authentication_failed)

# File Integrity Monitoring. syscheck_file covers the change events; the
# registry groups are Windows-only and there are no Windows agents here, but
# leaving them in costs nothing and means the mapping does not need revisiting
# if one is ever enrolled.
[wazuh_fim]
search = index=wazuh sourcetype=wazuh:alerts "rule.groups{}"=syscheck

# Package installs and removals, which is how something arrives on a machine.
[wazuh_package_change]
search = index=wazuh sourcetype=wazuh:alerts ("rule.groups{}"=dpkg OR "rule.groups{}"=rpm OR "rule.groups{}"=yum OR "rule.groups{}"=syscollector)

# Malware verdicts, and only verdicts.
#
# Matching the whole virustotal group is wrong and it is worth writing down why.
# The integration raises an alert for every outcome it has, including 87101 for
# a rate-limit refusal and 87103 for a file the service has never seen. Those
# are the integration reporting on itself, not a finding, and they outnumber
# real verdicts by roughly a thousand to one. Only 87105 carries
# data.virustotal.malicious=1, so that field is what this keys on. Alongside it
# sit the two checks that do not depend on an external service at all: the local
# known-bad hash list, and rootcheck's own trojan and rootkit signatures.
[wazuh_malware]
search = index=wazuh sourcetype=wazuh:alerts ("data.virustotal.malicious"=1 OR "rule.groups{}"=known_bad_hash OR "rule.groups{}"=trojan OR "rule.groups{}"=rootkit)

# The manager's own view of whether an agent is talking to it. Rule 500 through
# 504 are agent started, disconnected, removed, started again and connection
# events, all in the ossec group.
[wazuh_agent_state]
search = index=wazuh sourcetype=wazuh:alerts "rule.groups{}"=ossec ("rule.id"=500 OR "rule.id"=501 OR "rule.id"=502 OR "rule.id"=503 OR "rule.id"=504)

# Anything the manager scored at 12 or above. This is the escalation feed the
# dashboard's top strip reads, kept separate from any one product's groups.
[wazuh_high_severity]
search = index=wazuh sourcetype=wazuh:alerts "rule.level">=12
