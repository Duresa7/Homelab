# Wazuh Insights: one dashboard over the Wazuh alert stream, with CIM mapping
# so endpoint events join the UniFi network events already in Enterprise Security.
[install]
state = enabled
is_configured = 1

[ui]
is_visible = 1
label = Wazuh Insights

[launcher]
author = Duresa Kadi
description = A single operational view over the Wazuh manager's alert stream in the wazuh index: malware, logins, watched-file changes, scheduled tasks, package changes, listening ports and agent health, with Common Information Model mapping for Enterprise Security.
version = 1.0.0

[package]
id = wazuh_insights
