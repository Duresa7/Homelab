# The index the Wazuh manager's alerts land in.
#
# Named for the product rather than the data domain, which breaks the net*/os*
# convention the other indexes follow. That is deliberate: this is a single
# product pipeline whose 30-day retention differs from every other index here,
# and retention is set per index. Keeping it separate is what makes the 30 days
# enforceable without touching anything else.
#
# Sizing: the manager writes roughly 5,200 alerts a day at about 676 bytes each,
# so ~3.5 MB/day raw and ~105 MB over the 30-day window. The 5 GB cap matches
# the other indexes on this instance and leaves room for the malware detection
# and wider file monitoring to raise the rate without silently dropping data.
[wazuh]
homePath   = $SPLUNK_DB/wazuh/db
coldPath   = $SPLUNK_DB/wazuh/colddb
thawedPath = $SPLUNK_DB/wazuh/thaweddb
# 30 days.
frozenTimePeriodInSecs = 2592000
maxTotalDataSizeMB = 5120
