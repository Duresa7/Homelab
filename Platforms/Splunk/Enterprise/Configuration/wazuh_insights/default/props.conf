# Field mapping for the Wazuh manager's alert stream.
#
# The forwarder ships one JSON object per line from
# /var/ossec/logs/alerts/alerts.json. Splunk's automatic JSON handling already
# extracts the nested names (rule.level, agent.name, syscheck.path and so on),
# so this file does two things: it pins the parsing so a long alert is never
# truncated or misdated, and it translates Wazuh's names onto the Common
# Information Model so Enterprise Security can use them alongside the UniFi
# data already in netfw and netops.

[wazuh:alerts]
KV_MODE = json
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# Wazuh alerts carrying a full package list or a long full_log run past the
# 10 KB default, which would cut the JSON mid-object and lose every field.
TRUNCATE = 32768
# Read the alert's own timestamp rather than letting Splunk guess from _raw.
# Wazuh writes an explicit UTC offset, so this stays correct regardless of what
# timezone the manager or the indexer is set to.
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 32

# --- Identity -------------------------------------------------------------
# The agent is the machine the alert is about, which is CIM's dest.
FIELDALIAS-wazuh_dest = "agent.name" AS dest
FIELDALIAS-wazuh_dest_ip = "agent.ip" AS dest_ip
FIELDALIAS-wazuh_agent = "agent.id" AS agent_id
EVAL-dvc = 'manager.name'
EVAL-vendor_product = "Wazuh"

# --- Who and where from ---------------------------------------------------
FIELDALIAS-wazuh_src = "data.srcip" AS src
FIELDALIAS-wazuh_src_port = "data.srcport" AS src_port
# dstuser is the account being acted on, srcuser the one doing it. Authentication
# wants the target account in user, so dstuser wins where both are present.
EVAL-user = coalesce('data.dstuser', 'data.srcuser', 'data.logname')
FIELDALIAS-wazuh_src_user = "data.srcuser" AS src_user

# --- The rule itself ------------------------------------------------------
FIELDALIAS-wazuh_signature = "rule.description" AS signature
FIELDALIAS-wazuh_signature_id = "rule.id" AS signature_id
EVAL-app = coalesce('decoder.name', 'predecoder.program_name')
# Wazuh's own banding, so the dashboard and the Wazuh UI agree on what is high.
EVAL-severity = case('rule.level'>=15,"critical", 'rule.level'>=12,"high", 'rule.level'>=7,"medium", 'rule.level'>=1,"low", 1==1,"informational")
EVAL-severity_id = case('rule.level'>=15,4, 'rule.level'>=12,3, 'rule.level'>=7,2, 'rule.level'>=1,1, 1==1,0)

# --- Authentication -------------------------------------------------------
# Wazuh states the outcome in the rule's groups rather than in a field, so the
# groups are what action is derived from.
EVAL-action = case(\
  match(mvjoin('rule.groups{}',","), "authentication_success"), "success", \
  match(mvjoin('rule.groups{}',","), "authentication_failed|authentication_failures|invalid_login|win_authentication_failed"), "failure", \
  'syscheck.event'=="added", "created", \
  'syscheck.event'=="modified", "modified", \
  'syscheck.event'=="deleted", "deleted", \
  1==1, null())

# --- File Integrity Monitoring, onto Endpoint Changes ---------------------
FIELDALIAS-wazuh_file_path = "syscheck.path" AS file_path
EVAL-file_name = if(isnotnull('syscheck.path'), mvindex(split('syscheck.path',"/"), -1), null())
# SHA256 first: it is what a hash lookup or a threat feed will want.
EVAL-file_hash = coalesce('syscheck.sha256_after', 'syscheck.sha1_after', 'syscheck.md5_after')
FIELDALIAS-wazuh_file_size = "syscheck.size_after" AS file_size
FIELDALIAS-wazuh_file_mode = "syscheck.perm_after" AS file_acl
EVAL-object = coalesce('syscheck.path', 'data.package')
# Conditional on purpose. Enterprise Security tags filesystem from
# object_category=file, so setting this unconditionally puts every login and
# every service failure into the Endpoint Filesystem data model. It is set only
# where there is really an object.
EVAL-object_category = case(isnotnull('syscheck.path'), "file", isnotnull('data.package'), "package", 1==1, null())
EVAL-object_attrs = mvjoin('syscheck.changed_attributes{}', ", ")
EVAL-status = case(isnotnull('syscheck.path') OR isnotnull('data.package'), "success", 1==1, null())

# --- Package changes, onto Endpoint Changes -------------------------------
EVAL-package_name = 'data.package'
EVAL-package_version = 'data.version'

# --- MITRE ----------------------------------------------------------------
EVAL-mitre_technique_id = mvjoin('rule.mitre.id{}', ", ")
EVAL-mitre_technique = mvjoin('rule.mitre.technique{}', ", ")
EVAL-mitre_tactic = mvjoin('rule.mitre.tactic{}', ", ")

# --- Malware --------------------------------------------------------------
# VirusTotal writes its verdict under data.virustotal. These evaluate to null
# until the integration is enabled, and cost nothing while they are null.
EVAL-vt_positives = 'data.virustotal.positives'
EVAL-vt_total = 'data.virustotal.total'
EVAL-vt_permalink = 'data.virustotal.permalink'
EVAL-vt_malicious = 'data.virustotal.malicious'
