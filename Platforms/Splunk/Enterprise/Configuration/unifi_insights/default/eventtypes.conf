# Event classes the CIM tags in tags.conf attach to.
#
# The three UniFi products use separate class ranges and they do not overlap:
# UniFi Network in the 100s to 500s, UniFi OS in the 1000s, UniFi Protect in
# the 2000s. Grouping by meaning rather than by product keeps one event type
# per CIM concept instead of three.
#
# Network: 100/107/112/113 internet health, 200/201 threat detected and
#   blocked, 203 firewall block, 400/401 WiFi client connect and disconnect,
#   403/404 the wired equivalents, 414 power cycle, 510 device updated,
#   512/513 device offline and back, 520/521 VPN, 528/530 channel change,
#   539 address conflict, 544 console access, 545-549 configuration changes,
#   578 network updated.
# UniFi OS: 1 test event, 1000 console access, 1005 configuration change,
#   1103 backup created.
# Protect: 2008 access, 2150 disconnect, 2159 motion, 2161 smart detections,
#   2163 codec change, 2168 camera connected, 2305 video deleted,
#   2308 admin activity.
#
# Class 1 is UniFi OS's own test event. It is deliberately left untyped: it
# carries no subject and would otherwise land in a data model as a real event.

[unifi_flow_traffic]
search = index=netfw sourcetype=unifi:flow

# Only 203 is a traffic record. UNIFIcategory=Security also covers 200 and 201,
# which are IDS detections, and tagging those as network traffic would count
# every detection a second time inside Network_Traffic.
[unifi_cef_firewall]
search = index=netops sourcetype=cef sc4s_class=203

[unifi_cef_ids]
search = index=netops sourcetype=cef sc4s_class IN (200, 201)

[unifi_cef_admin_auth]
search = index=netops sourcetype=cef sc4s_class IN (544, 1000, 2008)

[unifi_cef_config_change]
search = index=netops sourcetype=cef sc4s_class IN (510, 545, 546, 547, 548, 549, 578, 1005, 1103, 2163, 2305, 2308)

[unifi_cef_session_start]
search = index=netops sourcetype=cef sc4s_class IN (400, 403, 520, 2168)

[unifi_cef_session_end]
search = index=netops sourcetype=cef sc4s_class IN (401, 404, 521, 2150)

# Internet and device health. This is the part of UniFi's own Insights that no
# other event type covers: an outage, a flapping uplink, a duplicate address.
[unifi_cef_device_alert]
search = index=netops sourcetype=cef sc4s_class IN (100, 107, 112, 113, 414, 512, 513, 528, 530, 539)

[unifi_protect_detection]
search = index=netops sourcetype=cef sc4s_class IN (2159, 2161)
