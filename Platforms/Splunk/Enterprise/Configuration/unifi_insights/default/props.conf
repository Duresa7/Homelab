# Field mapping for the two UniFi data sources.
#
# unifi:flow comes from the flow collector, which already emits Common
# Information Model names, so only the tail of the mapping is needed here.
# cef comes from the gateway's syslog export via SC4S and needs both a
# translation onto CIM and a repair, described under [cef] below.

[unifi:flow]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 12000
# Severity mirrors UniFi's own risk banding so views can sort on it.
EVAL-severity = case(risk=="high","high", risk=="medium","medium", risk=="low","low", 1==1, "informational")
EVAL-severity_id = case(risk=="high",3, risk=="medium",2, risk=="low",1, 1==1, 0)
EVAL-vendor_product = "Ubiquiti UniFi Network"
# The country name is what the choropleth and most readers want; the collector
# stores the ISO-2 code the controller reports.
LOOKUP-unifi_dest_country = geo_attr_countries iso2 AS dest_region OUTPUT country AS dest_country
LOOKUP-unifi_src_country = geo_attr_countries iso2 AS src_region OUTPUT country AS src_country

[cef]
# UniFi is the only CEF source on this instance.
#
# Repair first: CEF extension parsing splits key=value pairs on whitespace, so
# every UniFi value that contains a space is truncated at the first one --
# "UNIFIipsSignature=ET TOR Known Tor Exit Node Traffic group 25" is extracted
# as "ET", and device names, client aliases and policy names lose everything
# after their first word. The extractions below re-read each value from _raw up
# to the next CEF key, and write to new field names so they never collide with
# the truncated automatic extraction they replace.
EXTRACT-unifi_signature = UNIFIipsSignature=(?<signature>.+?)(?=\s+[A-Za-z][A-Za-z0-9]*=|$)
EXTRACT-unifi_rule = UNIFIpolicyName=(?<rule>.+?)(?=\s+[A-Za-z][A-Za-z0-9]*=|$)
EXTRACT-unifi_dvc_name = UNIFIdeviceName=(?<dvc_name>.+?)(?=\s+[A-Za-z][A-Za-z0-9]*=|$)
EXTRACT-unifi_gateway = UNIFIhost=(?<unifi_gateway>.+?)(?=\s+[A-Za-z][A-Za-z0-9]*=|$)
EXTRACT-unifi_src_alias = UNIFIsrcClientAlias=(?<src_alias>.+?)(?=\s+[A-Za-z][A-Za-z0-9]*=|$)
EXTRACT-unifi_dst_alias = UNIFIdstClientAlias=(?<dest_alias>.+?)(?=\s+[A-Za-z][A-Za-z0-9]*=|$)
EXTRACT-unifi_client_alias = UNIFIclientAlias=(?<client_alias>.+?)(?=\s+[A-Za-z][A-Za-z0-9]*=|$)
EXTRACT-unifi_wifi = UNIFIwifiName=(?<wifi_name>.+?)(?=\s+[A-Za-z][A-Za-z0-9]*=|$)
EXTRACT-unifi_devmodel = UNIFIdeviceModel=(?<dvc_model>.+?)(?=\s+[A-Za-z][A-Za-z0-9]*=|$)
EXTRACT-unifi_outif = deviceOutboundInterface=(?<outbound_interface>.+?)(?=\s+[A-Za-z][A-Za-z0-9]*=|$)
EXTRACT-unifi_inif = deviceInboundInterface=(?<inbound_interface>.+?)(?=\s+[A-Za-z][A-Za-z0-9]*=|$)
# The CEF header carries the event name, which SC4S leaves in _raw only.
# Not anchored to the start of the line: UniFi OS prefixes an ISO timestamp
# before CEF:, where UniFi Network does not, and an anchored pattern silently
# skipped every UniFi OS event.
EXTRACT-cef_header = CEF:\d+\|(?<cef_vendor>[^|]*)\|(?<cef_product>[^|]*)\|(?<cef_device_version>[^|]*)\|(?<cef_class_id>[^|]*)\|(?<cef_name>[^|]*)\|(?<cef_severity>[^|]*)\|

# Then the CIM translation.
FIELDALIAS-unifi_src = src AS src_ip
FIELDALIAS-unifi_dest = dst AS dest_ip
FIELDALIAS-unifi_ports = spt AS src_port, dpt AS dest_port
FIELDALIAS-unifi_action = act AS action
FIELDALIAS-unifi_sigid = UNIFIipsSignatureId AS signature_id
FIELDALIAS-unifi_zones = UNIFIsrcZone AS src_zone, UNIFIdstZone AS dest_zone
FIELDALIAS-unifi_regions = UNIFIsrcRegion AS src_region, UNIFIdstRegion AS dest_region
FIELDALIAS-unifi_srcmac = UNIFIsrcClientMac AS src_mac
FIELDALIAS-unifi_dstmac = UNIFIdstClientMac AS dest_mac
FIELDALIAS-unifi_bytes = UNIFItotalBytes AS bytes, UNIFIbytesSent AS bytes_out, UNIFIbytesReceived AS bytes_in
FIELDALIAS-unifi_packets = UNIFItotalPackets AS packets, UNIFIpacketsSent AS packets_out, UNIFIpacketsReceived AS packets_in
EVAL-transport = lower(proto)
EVAL-vendor_product = coalesce(sc4s_vendor,"Ubiquiti") . " " . coalesce(sc4s_product,"UniFi Network")
EVAL-dvc = coalesce(dvc_name, unifi_gateway)
EVAL-src = coalesce(src_alias, UNIFIsrcClientHostname, client_alias, UNIFIclientHostname, src)
EVAL-dest = coalesce(dest_alias, UNIFIdstClientHostname, dst)
EVAL-user = coalesce(UNIFIadmin, suser)
# UniFi's own risk band wins where it exists, which is on the threat events.
# Everything else falls back to the CEF header severity, which UniFi does grade
# meaningfully: 10 Internet Down, 8 Device Offline and address conflict, 4 high
# latency and packet loss. Without the fallback every health event arrived as
# informational and could not be ranked.
EVAL-severity = case(UNIFIrisk=="high","high", UNIFIrisk=="medium","medium", UNIFIrisk=="low","low", tonumber(cef_severity)>=9,"critical", tonumber(cef_severity)>=7,"high", tonumber(cef_severity)>=5,"medium", tonumber(cef_severity)>=3,"low", 1==1,"informational")
EVAL-severity_id = case(UNIFIrisk=="high",3, UNIFIrisk=="medium",2, UNIFIrisk=="low",1, tonumber(cef_severity)>=9,4, tonumber(cef_severity)>=7,3, tonumber(cef_severity)>=5,2, tonumber(cef_severity)>=3,1, 1==1,0)
EVAL-ids_type = "network"
EVAL-app = coalesce(app, UNIFIapplication)
EVAL-risk = UNIFIrisk
EVAL-direction = UNIFIdirection
LOOKUP-unifi_cef_dest_country = geo_attr_countries iso2 AS UNIFIdstRegion OUTPUT country AS dest_country
LOOKUP-unifi_cef_src_country = geo_attr_countries iso2 AS UNIFIsrcRegion OUTPUT country AS src_country

# The Alerts data model wants a subject, a body and a type. None of the other
# models this sourcetype feeds read these three names, so setting them for
# every CEF event costs nothing and populates Alerts for the health and camera
# detection event types.
EVAL-subject = cef_name
EVAL-body = _raw
EVAL-type = "alert"
