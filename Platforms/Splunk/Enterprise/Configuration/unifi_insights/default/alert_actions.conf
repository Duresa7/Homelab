# The webhook payload carries a results_link that Splunk builds from this
# server's own name. Left alone that is https://splunk-siem:8000/..., which
# Discord rejects as "not a well formed URL" because the host has no dot, and
# which nothing outside this VM could resolve anyway. This is the address the
# reverse proxy publishes Splunk Web on, so the link in a Discord message opens.
# It applies to every alert action fired by a search in this app.
[default]
hostname = https://splunk.alphasecunited.com
