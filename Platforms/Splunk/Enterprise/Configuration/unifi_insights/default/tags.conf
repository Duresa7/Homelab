# CIM tagging. Network_Traffic takes the flow records and the CEF firewall
# blocks; Intrusion_Detection takes the threat events; Authentication takes
# console access on all three products; Change takes configuration edits;
# Network_Sessions takes client connect and disconnect; Alerts takes both the
# Protect camera detections and the network health events.

[eventtype=unifi_flow_traffic]
network = enabled
communicate = enabled

[eventtype=unifi_cef_firewall]
network = enabled
communicate = enabled

[eventtype=unifi_cef_ids]
ids = enabled
attack = enabled

[eventtype=unifi_cef_admin_auth]
authentication = enabled

[eventtype=unifi_cef_config_change]
change = enabled
audit = enabled

[eventtype=unifi_cef_session_start]
network = enabled
session = enabled
start = enabled

[eventtype=unifi_cef_session_end]
network = enabled
session = enabled
end = enabled

[eventtype=unifi_cef_device_alert]
alert = enabled

[eventtype=unifi_protect_detection]
alert = enabled
