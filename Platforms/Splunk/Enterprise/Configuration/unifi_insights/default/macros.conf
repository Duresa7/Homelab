# Shared base searches, so a dashboard panel and a correlation search cannot
# drift apart on what counts as a flow or a threat.

[unifi_flows]
definition = index=netfw sourcetype=unifi:flow
iseval = 0

[unifi_events]
definition = index=netops sourcetype=cef
iseval = 0

[unifi_threats]
definition = index=netops sourcetype=cef sc4s_class IN (200, 201)
iseval = 0

[unifi_blocked]
definition = index=netfw sourcetype=unifi:flow action=blocked
iseval = 0

# Bytes render as a unit-suffixed string; Splunk has no built-in for it.
[fmt_bytes(1)]
args = field
definition = eval $field$ = case($field$ >= 1099511627776, round($field$/1099511627776,2)." TB", $field$ >= 1073741824, round($field$/1073741824,2)." GB", $field$ >= 1048576, round($field$/1048576,2)." MB", $field$ >= 1024, round($field$/1024,2)." KB", 1==1, $field$." B")
iseval = 0

# Enterprise Security ships security_content_ctime, but it is not present on
# this instance, so the correlation searches use this instead. fieldformat
# keeps the epoch value underneath for sorting and shows a readable time.
[unifi_ctime(1)]
args = field
definition = fieldformat $field$=strftime($field$, "%Y-%m-%d %H:%M:%S")
iseval = 0
