# Correlation searches over the UniFi data.
#
# Tuning note that governs every rule below: the gateway's IPS reports ~180
# high-risk detections a day, and 10,849 of the 11,477 detections on record are
# the EMERGING_P2P signature set firing on this network's own BitTorrent
# traffic. Alerting on "high risk" as UniFi bands it would produce a notable
# queue that is ~95% torrent noise, so P2P is excluded by name in the threat
# rules and covered instead by the volume rule at the end, which only fires if
# P2P activity moves to a host that has not been doing it.
#
# Each rule runs on a cron offset from the others so they do not all contend
# for search slots at the top of the hour.
#
# Discord delivery, added 2026-09-03. Splunk is the only thing that posts
# security events to Discord; Wazuh and UniFi do not notify on their own. A
# rule that should reach Discord carries action.webhook pointing at the alert
# bot's /splunk endpoint on monitor-01, which accepts posts from this host and
# nothing else. alert.digest_mode = 0 makes Splunk run the action once per
# result row, so a rule grouped by source produces one message per source and
# the suppression fields apply per source too. Notables are untouched; the
# webhook is added alongside them. The rules that do not carry the webhook are
# still notable-only on purpose: they were tuned for a queue, not a phone.

[UniFi - Intrusion detection not blocked]
description = An IPS signature matched and the gateway let the traffic through. \
  These are the detections that need a human, because nothing stopped them. \
  Excluded: P2P as tuned noise; TOR, Scanning Activity and the four \
  reputation rules, each of which has its own rule in this file and was being \
  reported twice; and Web Infrastructure Servers signatures from the reverse \
  proxy on Access-A reaching my own services. Before the 2026-09-03 tuning \
  this rule matched 38 source-and-rule pairs in 30 days, 30 of them Tor from \
  one PC and 17 the reverse proxy; after it, 8.
search = `unifi_threats` action=allowed \
    NOT rule IN ("P2P", "TOR", "Scanning Activity", "CINS Army Reputation List", "Malicious User Agents", "Malware", "Exploit Kit") \
    NOT (rule="Web Infrastructure Servers" src IN ("docker-network", "192.168.85.2")) \
  | stats count, min(_time) as firstTime, max(_time) as lastTime, \
    values(signature) as signature, values(dest_ip) as dest_ip, \
    values(dest_port) as dest_port, values(src_zone) as src_zone, \
    values(dest_zone) as dest_zone by src, rule, severity \
  | `unifi_ctime(firstTime)` | `unifi_ctime(lastTime)`
cron_schedule = 12 * * * *
dispatch.earliest_time = -70m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = src,rule
alert.suppress.period = 21600s
alert.track = 1
alert.digest_mode = 0
action.correlationsearch.enabled = 1
action.correlationsearch.label = UniFi - Intrusion detection not blocked
action.notable = 1
action.notable.param.rule_title = UniFi IPS detection not blocked: $rule$ from $src$
action.notable.param.rule_description = The gateway's IPS matched $rule$ ($signature$) on traffic from $src$ and allowed it. $count$ detections in the last hour.
action.notable.param.security_domain = network
action.notable.param.severity = medium
action.notable.param.drilldown_name = All IPS detections for $src$
action.notable.param.drilldown_search = `unifi_threats` src="$src$"
action.webhook = 1
action.webhook.param.url = http://192.168.73.2:8080/splunk

[UniFi - Threat reputation or malicious user agent match]
description = The gateway matched a reputation list or a known-bad user agent. \
  Low volume and high value, so it fires on a single match.
search = `unifi_threats` rule IN ("CINS Army Reputation List", "Malicious User Agents", "Malware", "Exploit Kit") \
  | stats count, min(_time) as firstTime, max(_time) as lastTime, \
    values(signature) as signature, values(dest_ip) as dest_ip, \
    values(action) as action by src, rule \
  | `unifi_ctime(firstTime)` | `unifi_ctime(lastTime)`
cron_schedule = 17 * * * *
dispatch.earliest_time = -70m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 6
alert.suppress = 1
alert.suppress.fields = src,rule
alert.suppress.period = 14400s
alert.track = 1
alert.digest_mode = 0
action.correlationsearch.enabled = 1
action.correlationsearch.label = UniFi - Threat reputation or malicious user agent match
action.notable = 1
action.notable.param.rule_title = UniFi reputation match: $rule$ involving $src$
action.notable.param.rule_description = $src$ matched $rule$ ($signature$). Disposition was $action$.
action.notable.param.security_domain = threat
action.notable.param.severity = high
action.notable.param.drilldown_name = All detections for $src$
action.notable.param.drilldown_search = `unifi_threats` src="$src$"
action.webhook = 1
action.webhook.param.url = http://192.168.73.2:8080/splunk

[UniFi - Outbound scanning activity]
description = A host on this network is producing scan signatures outbound, \
  which is what a compromised machine looks like from the gateway's side. \
  ansible-01 is excluded because probing managed hosts is its job; remove \
  that exclusion if the control node itself is ever in question.
search = `unifi_threats` rule="Scanning Activity" src!="ansible-01" \
  | stats count, dc(dest_ip) as targets, min(_time) as firstTime, \
    max(_time) as lastTime, values(signature) as signature, \
    values(dest_port) as dest_port by src, src_zone \
  | where count >= 5 \
  | `unifi_ctime(firstTime)` | `unifi_ctime(lastTime)`
cron_schedule = 22 * * * *
dispatch.earliest_time = -70m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 6
alert.suppress = 1
alert.suppress.fields = src
alert.suppress.period = 21600s
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = UniFi - Outbound scanning activity
action.notable = 1
action.notable.param.rule_title = UniFi outbound scanning from $src$
action.notable.param.rule_description = $src$ produced $count$ scan detections against $targets$ distinct destinations.
action.notable.param.security_domain = network
action.notable.param.severity = high
action.notable.param.drilldown_name = Scan detections from $src$
action.notable.param.drilldown_search = `unifi_threats` src="$src$" rule="Scanning Activity"

[UniFi - Tor network traffic]
description = A host reached a Tor relay or exit node. Not malicious by itself, \
  but it is worth knowing which host and when.
search = `unifi_threats` rule="TOR" \
  | stats count, dc(dest_ip) as nodes, min(_time) as firstTime, \
    max(_time) as lastTime, values(signature) as signature by src, src_zone \
  | `unifi_ctime(firstTime)` | `unifi_ctime(lastTime)`
cron_schedule = 27 * * * *
dispatch.earliest_time = -70m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = src
alert.suppress.period = 86400s
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = UniFi - Tor network traffic
action.notable = 1
action.notable.param.rule_title = UniFi Tor traffic from $src$
action.notable.param.rule_description = $src$ contacted $nodes$ Tor node(s), $count$ detections.
action.notable.param.security_domain = network
action.notable.param.severity = low
action.notable.param.drilldown_name = Tor detections for $src$
action.notable.param.drilldown_search = `unifi_threats` src="$src$" rule="TOR"

[UniFi - Blocked inbound flow spike from a single source]
description = One outside address hitting the perimeter hard enough to stand \
  out. Baseline is ~120 blocked flows a day in total, nearly all Region \
  Blocking, so a single source crossing 25 in fifteen minutes is unusual.
search = `unifi_blocked` direction=incoming \
  | stats count, dc(dest_port) as ports, min(_time) as firstTime, \
    max(_time) as lastTime, values(rule) as rule, \
    values(src_country) as src_country, values(transport) as transport \
    by src_ip \
  | where count >= 25 \
  | `unifi_ctime(firstTime)` | `unifi_ctime(lastTime)`
cron_schedule = */15 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 7200s
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = UniFi - Blocked inbound flow spike from a single source
action.notable = 1
action.notable.param.rule_title = UniFi blocked-flow spike from $src_ip$
action.notable.param.rule_description = $src_ip$ ($src_country$) had $count$ inbound flows blocked across $ports$ ports in fifteen minutes, by $rule$.
action.notable.param.security_domain = network
action.notable.param.severity = medium
action.notable.param.drilldown_name = All blocked flows from $src_ip$
action.notable.param.drilldown_search = `unifi_flows` action=blocked src_ip="$src_ip$"

[UniFi - Controller configuration changed]
description = A configuration change on the controller. Every change here is \
  made by one administrator, so this is a record rather than a suspicion; it \
  matters when a change correlates with something breaking. The built-in \
  Unifi and Network service accounts are excluded: they account for 534 of \
  the 767 changes on record and are the controller acting on its own.
search = eventtype=unifi_cef_config_change user!="Unifi" user!="Network" \
  | stats count, min(_time) as firstTime, max(_time) as lastTime, \
    values(cef_name) as change, values(UNIFIsettingsSection) as section, \
    values(src_ip) as src_ip by user \
  | `unifi_ctime(firstTime)` | `unifi_ctime(lastTime)`
cron_schedule = 32 * * * *
dispatch.earliest_time = -70m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = user
alert.suppress.period = 3600s
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = UniFi - Controller configuration changed
action.notable = 1
action.notable.param.rule_title = UniFi configuration changed by $user$
action.notable.param.rule_description = $user$ made $count$ configuration change(s): $change$ in $section$.
action.notable.param.security_domain = audit
action.notable.param.severity = informational
action.notable.param.drilldown_name = Configuration changes by $user$
action.notable.param.drilldown_search = eventtype=unifi_cef_config_change user="$user$"

[UniFi - Admin console access from an unexpected network]
description = Console access from outside the networks the administrator \
  normally uses. Management, Trusted, Secure and the WAN address are the \
  known-good set; anything else is worth a look.
search = eventtype=unifi_cef_admin_auth \
  | where NOT (cidrmatch("192.168.1.0/24", src_ip) \
      OR cidrmatch("192.168.10.0/24", src_ip) \
      OR cidrmatch("192.168.50.0/24", src_ip) \
      OR cidrmatch("192.168.70.0/24", src_ip)) \
  | stats count, min(_time) as firstTime, max(_time) as lastTime, \
    values(UNIFIaccessMethod) as method, values(src_country) as src_country \
    by user, src_ip \
  | `unifi_ctime(firstTime)` | `unifi_ctime(lastTime)`
cron_schedule = 37 * * * *
dispatch.earliest_time = -70m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = user,src_ip
alert.suppress.period = 86400s
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = UniFi - Admin console access from an unexpected network
action.notable = 1
action.notable.param.rule_title = UniFi console access by $user$ from $src_ip$
action.notable.param.rule_description = $user$ signed in to the controller from $src_ip$ ($src_country$) using $method$, which is outside the usual management networks.
action.notable.param.security_domain = access
action.notable.param.severity = medium
action.notable.param.drilldown_name = Console access by $user$
action.notable.param.drilldown_search = eventtype=unifi_cef_admin_auth user="$user$"

[UniFi - P2P signature activity from a new host]
description = Catches the tuned-out P2P noise moving somewhere new. The rule \
  ignores hosts that already produced P2P detections in the preceding week, so \
  it stays quiet for the known torrent host and speaks up for any other.
search = `unifi_threats` rule="P2P" earliest=-1h \
  | stats count by src \
  | search NOT \
    [ search `unifi_threats` rule="P2P" earliest=-8d latest=-1h \
      | stats count by src | fields src ] \
  | where count >= 10
cron_schedule = 42 * * * *
dispatch.earliest_time = -8d
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = src
alert.suppress.period = 604800s
alert.track = 1
action.correlationsearch.enabled = 1
action.correlationsearch.label = UniFi - P2P signature activity from a new host
action.notable = 1
action.notable.param.rule_title = UniFi P2P activity from a new host: $src$
action.notable.param.rule_description = $src$ produced $count$ P2P detections in the last hour and had none in the previous week.
action.notable.param.security_domain = network
action.notable.param.severity = low
action.notable.param.drilldown_name = P2P detections for $src$
action.notable.param.drilldown_search = `unifi_threats` rule="P2P" src="$src$"

# The three rules below exist for Discord rather than for the notable queue,
# so they carry the webhook and no notable action.

[UniFi - Intrusion detection blocked]
description = The IPS stopped something. One message per source per hour, so \
  a source that trips a signature all afternoon is one line an hour, not a \
  flood. Excluded: P2P and TOR, which are tuned noise; the four reputation \
  rules, which already alert on their own regardless of disposition; \
  scanning signatures from ansible-01, whose job is probing managed hosts; \
  and Web Infrastructure Servers signatures raised by the reverse proxy on \
  Access-A talking to my own services, which were 15 of the 41 source-hours \
  on record. ubuntu-dev sat in that scan exclusion as 192.168.40.179 until \
  2026-09-12. It never matched, because src carries the UniFi client name \
  rather than the address, and I chose to alert on scans from that host \
  rather than repair the exclusion.
search = `unifi_threats` action=blocked \
    NOT rule IN ("P2P", "TOR", "CINS Army Reputation List", "Malicious User Agents", "Malware", "Exploit Kit") \
    NOT (rule="Scanning Activity" src="ansible-01") \
    NOT (rule="Web Infrastructure Servers" src_zone="AlphaSec-Access") \
  | stats count, min(_time) as firstTime, max(_time) as lastTime, \
    values(signature) as signature, values(dest_ip) as dest_ip, \
    values(dest_port) as dest_port, values(dest_zone) as dest_zone, \
    values(action) as action by src, rule, src_zone \
  | `unifi_ctime(firstTime)` | `unifi_ctime(lastTime)`
cron_schedule = 47 * * * *
dispatch.earliest_time = -70m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = src,rule
alert.suppress.period = 3600s
alert.digest_mode = 0
alert.track = 1
action.webhook = 1
action.webhook.param.url = http://192.168.73.2:8080/splunk

[UniFi - Internal host blocked repeatedly]
description = A host on a server or workstation VLAN had 20 or more flows \
  denied by the internal firewall inside ten minutes. That is what a \
  misconfigured service, a scanner or something worse looks like from the \
  gateway. Trusted (VLAN 50) is left out: its denies are phones and TVs \
  probing for things they are not allowed to reach. Nothing in the 30 days \
  before this rule was written would have crossed the line; the busiest \
  pairing was 33 denies over the whole month.
search = `unifi_blocked` direction=local \
  | where cidrmatch("192.168.30.0/24", src_ip) OR cidrmatch("192.168.40.0/24", src_ip) \
      OR cidrmatch("192.168.70.0/24", src_ip) OR cidrmatch("192.168.72.0/24", src_ip) \
      OR cidrmatch("192.168.73.0/24", src_ip) OR cidrmatch("192.168.80.0/24", src_ip) \
      OR cidrmatch("192.168.85.0/24", src_ip) \
  | stats count, dc(dest_ip) as targets, dc(dest_port) as ports, \
    values(dest_ip) as dest_ip, values(dest_port) as dest_port, \
    values(rule) as rule, values(src_network) as src_network, \
    values(dest_network) as dest_network by src_ip \
  | where count >= 20
cron_schedule = 3-59/10 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 3600s
alert.digest_mode = 0
alert.track = 1
action.webhook = 1
action.webhook.param.url = http://192.168.73.2:8080/splunk

[UniFi - Syslog export has gone quiet]
description = No UniFi event of any kind has arrived in six hours. The export \
  broke silently once before (the SIEM address on the console was cleared, \
  see the 2026-08-29 change record) and every UniFi rule above returns \
  nothing rather than something when that happens. Six hours because the \
  30-day history had one hour and one four-hour block with zero events; the \
  quietest six-hour block held 13. Runs hourly, so a dead export is reported \
  between six and seven hours in, and once a day after that.
search = `unifi_events` | stats count | where count = 0 \
  | eval description = "No UniFi syslog events reached Splunk in the last six hours. Check the console's SIEM server setting and the SC4S listener on 1514."
cron_schedule = 52 * * * *
dispatch.earliest_time = -6h
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 86400s
alert.track = 1
action.webhook = 1
action.webhook.param.url = http://192.168.73.2:8080/splunk
