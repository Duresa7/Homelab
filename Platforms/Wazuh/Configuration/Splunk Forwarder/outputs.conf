# Where the forwarder sends. splunk-siem on the same VLAN as security-01,
# so this traffic never reaches the gateway and needs no UniFi policy.
[tcpout]
defaultGroup = splunk_siem

[tcpout:splunk_siem]
server = 192.168.72.3:9997
# Hold events on disk if the indexer is down rather than dropping them.
maxQueueSize = 64MB
useACK = true
