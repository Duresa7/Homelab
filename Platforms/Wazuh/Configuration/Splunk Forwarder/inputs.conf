# What the forwarder on security-01 reads.
#
# One file: the manager's live alert stream. Wazuh writes every alert that
# clears the rule threshold here as one JSON object per line, and rotates the
# file at midnight into logs/alerts/<year>/<month>/. Only the live file is
# monitored, deliberately -- pointing at the rotated archive would re-ingest
# history, and the agreement was to start from today and go forward.
#
# crcSalt is not set. The default is correct here: the file keeps its name
# across rotation, and Splunk's CRC of the first 256 bytes changes when a new
# day's file begins, so the new file is treated as new rather than as a
# continuation of the old one.
#
# host is pinned rather than left to default to the OS hostname. It was pinned
# on 2026-09-01, ahead of renaming the guest from wazuh-01 to security-01, so
# that the rename did not split the host field mid-stream. Pinned, it also
# means a future rename is invisible to Splunk.
[monitor:///var/ossec/logs/alerts/alerts.json]
index = wazuh
sourcetype = wazuh:alerts
host = security-01
disabled = 0
