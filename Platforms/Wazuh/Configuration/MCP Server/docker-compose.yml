name: wazuh-mcp-server

services:
  wazuh-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: wazuh-mcp-server-local:4.3.0-compat
    container_name: wazuh-mcp-server
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      WAZUH_HOST: https://localhost
      WAZUH_PORT: "55000"
      WAZUH_VERIFY_SSL: "true"
      WAZUH_INDEXER_HOST: https://127.0.0.1
      WAZUH_INDEXER_PORT: "9200"
      WAZUH_INDEXER_SSL: "true"
      WAZUH_INDEXER_VERIFY_SSL: "true"
      SSL_CERT_FILE: /etc/ssl/certs/wazuh-combined-ca-bundle.pem
      MCP_HOST: 192.168.72.2
      MCP_PORT: "3000"
      ENVIRONMENT: production
      AUTH_MODE: bearer
      MCP_API_KEY_SCOPES: wazuh:read
      ALLOWED_ORIGINS: https://mcp.alphasecunited.com
      LOG_LEVEL: INFO
      RESPONSE_FORMAT: json
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /app/logs:rw,noexec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --max-time 5 http://192.168.72.2:3000/health | jq -e '.status == "healthy"' >/dev/null
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
