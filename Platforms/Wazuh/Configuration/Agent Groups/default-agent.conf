<!--
  Every agent is in this group, so anything here applies to the whole fleet.
-->
<agent_config os="Linux">
  <syscheck>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/ssh</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/cron.d</directories>
    <frequency>21600</frequency>
    <alert_new_files>yes</alert_new_files>
  </syscheck>

  <!--
    Rootcheck's trojan check is off, and the reason is that it was wrong every
    single time. It works by grepping system binaries for strings a trojaned
    copy might contain, and on Debian the ordinary setuid binaries contain them:
    /bin/chfn, /bin/chsh and /bin/passwd account for over 6,000 of the roughly
    10,000 "Trojaned version of file detected" alerts on this fleet, and not one
    of them is a real finding. A check with a hundred per cent false-positive
    rate is worse than no check, because it is the noise every real alert has to
    be found inside.

    Nothing is left uncovered by turning it off. A modified system binary still
    shows up as a file-integrity change, and a file that is actually malicious
    is caught by its hash, either against the local known-bad list or through
    VirusTotal. Those look at what the file is rather than guessing from a
    string match.

    check_dev stays on, because a file hidden under /dev is a real technique.
    The only false positives it produces here are the /dev/.lxc entries that
    exist inside every LXC container, so those are ignored by name.
  -->
  <rootcheck>
    <check_trojans>no</check_trojans>
    <ignore>/dev/.lxc</ignore>
  </rootcheck>
</agent_config>
