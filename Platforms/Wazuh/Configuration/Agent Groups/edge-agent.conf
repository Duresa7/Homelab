<!--
  edge-01, agent 005. The only host reachable from the Internet: it runs Caddy
  and the Cloudflare Tunnel, so it is the machine an outsider reaches first.
  It is also the machine with no IPS coverage, because DMZ (VLAN 30) is not in
  the gateway's Threat Management list. That makes file monitoring here the
  main thing watching it.
-->
<agent_config os="Linux">
  <syscheck>
    <!-- The tunnel's configuration and credentials: the inbound path itself. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/cloudflared</directories>

    <!-- The reverse proxy's routing. A change here silently redirects a public name. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/caddy</directories>

    <!-- Where a web-facing process can write, and where a dropped payload lands. -->
    <directories check_all="yes" realtime="yes">/tmp</directories>
    <directories check_all="yes" realtime="yes">/var/tmp</directories>

    <!-- Binaries outside the package manager. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/usr/local/bin</directories>

    <!-- Keys and authorised access. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/home/dkadi/.ssh</directories>

    <!-- Persistence. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/systemd/system</directories>

    <ignore type="sregex">\.sw[px]$</ignore>
    <ignore type="sregex">\.tmp$</ignore>
    <ignore type="sregex">~$</ignore>

    <frequency>21600</frequency>
    <alert_new_files>yes</alert_new_files>
  </syscheck>
</agent_config>
