<!--
  The five Proxmox nodes: grey-server, purple-server, blue-server, red-server
  and green-server.

  Nothing here adds a watch. Wazuh's stock configuration already monitors /etc,
  and on a Proxmox node /etc/pve is not an ordinary directory: it is pmxcfs, a
  FUSE filesystem backed by the cluster database. Its status files are rewritten
  by the cluster itself every few seconds, so the default watch reports each of
  them changing several hundred times a day. Five nodes doing that drowns every
  real /etc change on the fleet, and a file-integrity feed nobody can read is a
  file-integrity feed nobody checks.

  What is ignored here is the part of /etc/pve that is state. What stays watched
  is the part that is configuration and would matter if it changed without me:
  corosync.conf, storage.cfg, user.cfg, the firewall rules and the guest
  definitions.
-->
<agent_config os="Linux">
  <syscheck>
    <!-- Cluster state files directly under /etc/pve: .rrd, .version, .members,
         .vmlist, .clusterlog. All are written continuously by pmxcfs. -->
    <ignore type="sregex">/etc/pve/\.</ignore>

    <!-- High-availability heartbeat. crm_commands and manager_status are the
         cluster manager talking to itself; lrm_status is each node reporting in. -->
    <ignore>/etc/pve/ha/crm_commands</ignore>
    <ignore>/etc/pve/ha/manager_status</ignore>
    <ignore type="sregex">/etc/pve/nodes/\w+/lrm_status</ignore>

    <!-- Proxmox rotates this key on a schedule, so a change is the product
         working rather than something to look at. -->
    <ignore>/etc/pve/priv/authkey.key</ignore>

    <!-- Written on every pveproxy restart with the current certificate serial. -->
    <ignore>/etc/apt/apt.conf.d/76pveproxy</ignore>
  </syscheck>
</agent_config>
