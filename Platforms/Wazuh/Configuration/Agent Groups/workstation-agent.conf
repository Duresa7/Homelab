<!--
  ubuntu-dev, agent 020. The one machine I sit at, so it is the one machine
  where a file arrives because a person chose to download it. That makes it the
  first place to widen file monitoring and the place where a VirusTotal lookup
  has something to look up.

  /tmp and /var/tmp are watched without report_changes on purpose. Storing a
  diff of every temporary file a build tool writes costs disk and tells me
  nothing; I want to know a file appeared and what its hash is, not what
  changed inside it.

  They are also restricted by filename, which is the correction that made this
  group usable. Watching all of /tmp on a machine somebody actually works at
  produced 2,334 alerts from a single scratch directory in one day, and the
  VirusTotal integration answered 2,697 of the resulting lookups with "Public
  API request rate limit reached". The noise was not merely untidy: it consumed
  the daily quota, so the one thing this group exists to catch would have been
  refused a verdict. The restrict expression keeps the case that matters, a
  payload written into world-writable space, and drops the session state that
  every desktop application keeps there.
-->
<agent_config os="Linux">
  <syscheck>
    <!-- Where a downloaded file lands before anyone decides what to do with it. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/home/ai-agent/Downloads</directories>

    <!--
      World-writable scratch space, and the usual resting place for a dropped
      payload. restrict is what separates the payload from the noise: a script,
      an executable, an archive or a package is worth a hash and a lookup, and a
      browser's cookie file is not.
    -->
    <directories check_all="yes" realtime="yes" restrict="\.sh$|\.bash$|\.py$|\.pl$|\.rb$|\.php$|\.elf$|\.bin$|\.run$|\.out$|\.so$|\.ko$|\.exe$|\.dll$|\.ps1$|\.jar$|\.deb$|\.rpm$|\.appimage$|\.zip$|\.tar$|\.tgz$|\.gz$|\.bz2$|\.xz$|\.7z$|\.rar$|\.iso$">/tmp</directories>
    <directories check_all="yes" realtime="yes" restrict="\.sh$|\.bash$|\.py$|\.pl$|\.rb$|\.php$|\.elf$|\.bin$|\.run$|\.out$|\.so$|\.ko$|\.exe$|\.dll$|\.ps1$|\.jar$|\.deb$|\.rpm$|\.appimage$|\.zip$|\.tar$|\.tgz$|\.gz$|\.bz2$|\.xz$|\.7z$|\.rar$|\.iso$">/var/tmp</directories>

    <!-- Binaries installed outside the package manager, which nothing else audits. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/usr/local/bin</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/opt</directories>

    <!-- Keys, and the file that decides who may log in. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/home/ai-agent/.ssh</directories>

    <!-- Persistence: a user-level timer or service survives reboots the same as a root one. -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/home/ai-agent/.config/systemd/user</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/systemd/system</directories>

    <!-- Editor swap files, part-downloads and lock files churn constantly and mean nothing. -->
    <ignore type="sregex">\.sw[px]$</ignore>
    <ignore type="sregex">\.tmp$</ignore>
    <ignore type="sregex">\.part$</ignore>
    <ignore type="sregex">\.crdownload$</ignore>
    <ignore type="sregex">~$</ignore>
    <ignore>/tmp/.X11-unix</ignore>
    <ignore>/tmp/.ICE-unix</ignore>

    <!--
      Tooling scratch space under /tmp.

      This is a development machine, so /tmp is the busiest directory on it and
      almost none of that traffic is interesting: per-session working
      directories, systemd's private mounts, snap's runtime dirs, mktemp files,
      and headless-browser profiles. Left in, they bury the one event that
      matters (a file arriving that should not be there) and they burn
      VirusTotal's daily lookup budget on files that were written by the machine
      itself thirty seconds earlier.
    -->
    <ignore type="sregex">/tmp/claude-</ignore>
    <ignore type="sregex">/tmp/systemd-private</ignore>
    <ignore type="sregex">/tmp/snap</ignore>
    <ignore type="sregex">/tmp/ssh-</ignore>
    <ignore type="sregex">/tmp/tmp</ignore>
    <ignore type="sregex">/tmp/playwright</ignore>
    <ignore type="sregex">/tmp/shottest</ignore>
    <ignore type="sregex">chromium</ignore>
    <ignore type="sregex">/tmp/pulse-</ignore>
    <ignore type="sregex">/tmp/dbus-</ignore>

    <!--
      Reverse-DNS scratch directories. Desktop applications name their /tmp
      working directories after their own bundle id, so the directory name is
      the vendor's name and the contents are session state. Matching the shape
      rather than each product keeps this from becoming a list I have to
      maintain, and keeps a vendor name out of an alert that ends up in a
      screenshot.
    -->
    <ignore type="sregex">/tmp/\w+\.\w+\.\w+\.</ignore>
    <ignore type="sregex">/tmp/\.\w+\.\w+\.\w+\.</ignore>

    <frequency>21600</frequency>
    <alert_new_files>yes</alert_new_files>
  </syscheck>
</agent_config>
