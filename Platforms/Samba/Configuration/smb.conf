# Samba configuration for the ubuntu-dev full-home share.
# The share uses the existing ai-agent Unix identity and does not alter
# ownership or permissions anywhere under /home/ai-agent.

[global]
    workgroup = WORKGROUP
    server string = ubuntu-dev
    server role = standalone server
    security = user
    map to guest = never
    usershare allow guests = no

    # Modern SMB only. NetBIOS services and ports 137-139 are not needed.
    server min protocol = SMB2_02
    server max protocol = SMB3
    smb ports = 445
    disable netbios = yes

    # Listen only on loopback and the LAN interface. Source-device and
    # LAN/VPN policy is enforced by the upstream network firewall.
    interfaces = lo ens18
    bind interfaces only = yes

    # This is a file server only.
    load printers = no
    disable spoolss = yes
    printing = bsd
    printcap name = /dev/null

    logging = file
    log file = /var/log/samba/log.%m
    max log size = 1000

[ai-agent]
    comment = Full home directory for ai-agent
    path = /home/ai-agent
    browseable = yes
    read only = no
    guest ok = no
    valid users = dkadi

    # Clients authenticate as the network-only dkadi account. After successful
    # authentication, file operations use the existing ai-agent Unix identity.
    force user = ai-agent

    # Make dot-directories visible to SMB clients. Finder may
    # still hide Unix dot-files until Show Hidden Files is enabled.
    hide dot files = no

    # Existing links inside the home continue to work, but links cannot escape
    # the exported /home/ai-agent tree.
    follow symlinks = yes
    wide links = no

    # New/atomically replaced files remain private to ai-agent. Existing files
    # are not modified by these masks.
    create mask = 0700
    force create mode = 0600
    directory mask = 0700
    force directory mode = 0700
    inherit owner = yes

    # Preserve macOS metadata and filename compatibility through SMB streams.
    vfs objects = catia fruit streams_xattr

[shared-folder]
    comment = Shared files between my machines
    path = /home/ai-agent/Documents/shared-folder
    browseable = yes
    read only = no
    guest ok = no
    valid users = dkadi

    force user = ai-agent

    hide dot files = no

    follow symlinks = yes
    wide links = no

    create mask = 0700
    force create mode = 0600
    directory mask = 0700
    force directory mode = 0700
    inherit owner = yes

    vfs objects = catia fruit streams_xattr
