# ~/.hermes/profiles/public/config.yaml: the chat-only Horus that answers in #secret.
model:
  default: claude-sonnet-5-5
  provider: anthropic
platform_toolsets:
  cli: [vision]
  discord: [vision]
memory:
  memory_enabled: false
  user_profile_enabled: false
