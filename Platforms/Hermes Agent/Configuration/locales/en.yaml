explainer.persistence.default: 'Horus couldn''t save this conversation, so it stopped rather than lose your messages. Possible causes: the drive is out of room, or another Horus process is holding the database. Close other Horus windows, run `hermes {profile_arg}doctor` to check storage, then send your message again.'
explainer.persistence.deleted_wal: 'another Horus process still holds an old copy of the session database''s write-ahead log, so Horus stopped writing to keep the file safe and this message was not saved (a copy is kept in {home}/sessions/). Nothing is lost. Quit every Horus process on this profile (Desktop app, `hermes {profile_arg}gateway stop`, dashboard, cron), run `hermes {profile_arg}doctor` — it names any process still holding the log — then start Horus again and send your message once more. Do not run `doctor --fix` or delete any state.db files while they run. Guide: {recovery_docs}'
explainer.persistence.disk: 'Horus couldn''t save this conversation to disk, so it stopped rather than lose your messages. The disk is probably full: free some space (or fix the permissions on {home}/state.db), then send your message again.'
explainer.persistence.fts_index: 'the turn was stopped because the session search index (FTS5) is corrupt and could not be detached, so this message was not saved. The message store itself is not damaged: do not run recovery tools or restore a backup. Run `hermes {profile_arg}doctor --fix` (or restart Horus, which repairs the index on open), then send your message again.'
explainer.persistence.locked: the turn was stopped because session storage was busy (another Horus process was writing to the state database). Your message should already be saved — please send it again in a moment.
explainer.persistence.replaced: the session database file was replaced while Horus was running, so this message was not saved (a copy is kept in {home}/sessions/). Stop Horus (`hermes {profile_arg}gateway stop`), run `hermes {profile_arg}doctor` — not `hermes {profile_arg}doctor --fix`, which would repair the wrong file in place — then start it again and send your message once more. Advanced recovery steps are in the log.
explainer.persistence.session_row_missing: this session was deleted from storage while the chat was still open, and Horus could not recreate it, so this message was not saved. Send your message again; if it keeps failing, run `hermes {profile_arg}doctor`.
explainer.persistence.turn_lease: the turn was stopped because another Horus process took over this session. Your reply was not saved — wait for the other process to finish, then send your message again.
