gateway.topic.root_lobby: 'This main chat is reserved for system commands.


  To start a new Horus chat, open the All Messages topic at the top of this bot interface and send any message there. Telegram will create a new topic for that message; each topic works as an independent Horus session.'
gateway.topic.root_new: 'To start a new parallel Horus chat, open the All Messages topic at the top of this bot interface and send any message there. Telegram will create a new topic for it.


  Each topic is an independent Horus session. Use /new inside an existing topic only if you want to replace that topic''s current session.'
