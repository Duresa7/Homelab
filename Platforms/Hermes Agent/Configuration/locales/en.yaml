tips.t043: Ctrl+Z suspends Horus to the background — run fg in your shell to resume.
tips.t072: hermes mcp-serve runs Horus itself as an MCP server for other agents.
tips.t076: hermes backup creates a zip backup of your entire Horus home directory.
tips.t080: hermes gateway install sets up Horus as a system service (systemd/launchd).
tips.t107: execute_code runs Python scripts that call Horus tools programmatically — results stay out of context.
tips.t133: When exiting, Horus prints a resume command with session ID and stats.
tips.t157: 'Horus runs on 21 messaging platforms: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, email, and more.'
tips.t160: BlueBubbles brings iMessage to Horus via a local macOS server.
tips.t177: Horus loads project context from .hermes.md, AGENTS.md, CLAUDE.md, or .cursorrules (first match).
tips.t208: hermes acp runs Horus as an ACP server for VS Code, Zed, and JetBrains integration.
tips.t219: SOUL.md completely replaces the agent's default identity — rewrite it to make Horus your own.
tips.t223: Before a gateway session reset, Horus auto-flushes important facts to memory in the background.
tips.t245: Profiles scope Horus state via HERMES_HOME; host tool subprocesses keep your real HOME unless terminal.home_mode is profile.
tips.t285: /goal <text> sets a standing Ralph-loop objective — Horus auto-continues turn after turn until a judge says done.
tips.t286: /snapshot create [label] saves a full state snapshot of Horus config; /snapshot restore <id> reverts later.
tips.t291: /busy queue|steer|interrupt controls what pressing Enter does while Horus is working.
tips.t316: hermes dashboard embeds the full Horus TUI in your browser via xterm.js and a WebSocket PTY.
tips.t354: hermes import restores a full Horus backup zip; session JSON/JSONL exports import from the dashboard Sessions page.
