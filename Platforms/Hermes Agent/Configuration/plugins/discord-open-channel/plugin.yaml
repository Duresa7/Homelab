name: discord-open-channel
version: "2.0"
description: Lets every sender in #secret and #ai-bot talk to Horus through the chat-only public profile, unlocks the full default profile in #ai-bot for 15 minutes per person and thread when they type the server code, keeps the code away from the model, keeps typed commands to DISCORD_ALLOWED_USERS, and keeps gateway lifecycle notices out of #secret.
