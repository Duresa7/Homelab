---
# SUPERSEDED 2026-08-15. Do not run this play.
#
# It grants ai-agent passwordless sudo on eleven hosts and dkadi passwordless
# sudo on six more. On 2026-08-15 I reversed the decision it rests on: dkadi
# and ai-agent are both password-gated now, and a sudo prompt asks for root's
# password by way of Defaults rootpw. Running this would undo that on eighteen
# grants at once, and it would do it quietly, because every task here succeeds.
#
# The file stays because the change record has to show what was planned before
# the reversal. It has never been run against a host. It is not the thing to
# reach for when writing the replacement: that is a play removing the drop-ins
# this one would write.
#
# The guard below is what stops an accidental run, including from Semaphore.
- name: Write the NOPASSWD sudoers drop-ins
  hosts: "{{ target | default('ai_agent_targets:ai_agent_key_only:dkadi_nopasswd_targets') }}"
  gather_facts: true
  become: true
  # One host at a time, and stop the whole play on the first failure. A broken
  # sudoers file is the one mistake here that locks an account out of root, so
  # it must never reach a second host.
  serial: "{{ host_access_serial | default(1) }}"
  any_errors_fatal: true
  vars:
    ai_agent_user: ai-agent
    dkadi_user: dkadi
  tasks:
    # First task, before facts are used and before anything is read, so a
    # mistaken run costs nothing. --check does not exempt it: a dry run of a
    # superseded play still reports a plan I do not want anyone acting on.
    - name: Refuse to run unless the reversal has been acknowledged
      run_once: true
      ansible.builtin.assert:
        that:
          - sudoers_nopasswd_acknowledged | default(false) | bool
        fail_msg: >-
          This play is superseded and grants passwordless sudo to dkadi and
          ai-agent, which is the opposite of the model adopted on 2026-08-15.
          If you are removing drop-ins, you want a different play. If you
          genuinely intend to restore NOPASSWD grants, re-read the fleet access
          priority in the root TODO first, then pass
          -e sudoers_nopasswd_acknowledged=true.
        quiet: true

    - name: Confirm a local controller run is on ansible-01
      when:
        - inventory_hostname == 'ansible-01'
        - (ansible_connection | default('ssh')) == 'local'
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == 'ansible-01'
        fail_msg: >-
          The ansible-01 inventory entry uses a local connection, but this
          runner reports hostname {{ ansible_facts.hostname }}. Run the project
          from ansible-01 or use an explicit SSH connection.
        quiet: true

    - name: Confirm the sudoers configuration parses before any change
      ansible.builtin.command:
        argv: [visudo, -c]
      register: sudoers_precheck
      changed_when: false
      check_mode: false

    - name: Read the account database
      ansible.builtin.getent:
        database: passwd

    # copy with validate writes a temp file, runs visudo -cf against that temp
    # path, and only moves it into place when visudo exits 0. That is the
    # temp-path-then-validate rule, enforced by the module rather than by hand.
    - name: Grant ai-agent passwordless sudo
      when:
        - inventory_hostname in (groups['ai_agent_targets'] + groups['ai_agent_key_only'])
        - ai_agent_user in ansible_facts.getent_passwd
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-ai-agent
        content: "{{ ai_agent_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: Grant dkadi passwordless sudo
      when:
        - inventory_hostname in groups['dkadi_nopasswd_targets']
        - dkadi_user in ansible_facts.getent_passwd
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-dkadi
        content: "{{ dkadi_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s

    - name: Confirm the whole sudoers configuration still parses
      ansible.builtin.command:
        argv: [visudo, -c]
      register: sudoers_postcheck
      changed_when: false
      check_mode: false

    - name: Prove each granted account resolves sudo without a password
      when: not ansible_check_mode
      become: true
      become_user: "{{ item }}"
      # sudo -n exits non-zero rather than prompting, so a still-password-gated
      # account fails here instead of hanging the play.
      #
      # "true" stays quoted. Unquoted, YAML reads it as a boolean and Ansible
      # passes the string True to sudo, which is not a command. This play had
      # that bug until 2026-08-15; it had never been run, so it never surfaced.
      ansible.builtin.command:
        argv: [sudo, -n, "true"]
      loop: "{{ sudoers_expected_accounts }}"
      vars:
        sudoers_expected_accounts: >-
          {{
            ([ai_agent_user] if (inventory_hostname in (groups['ai_agent_targets'] + groups['ai_agent_key_only'])
                                 and ai_agent_user in ansible_facts.getent_passwd) else [])
            + ([dkadi_user] if (inventory_hostname in groups['dkadi_nopasswd_targets']
                                and dkadi_user in ansible_facts.getent_passwd) else [])
          }}
      changed_when: false

    - name: Report the per-host result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          visudo={{ 'ok' if sudoers_postcheck.rc == 0 else 'FAILED' }}
          ai_agent_grant={{ inventory_hostname in (groups['ai_agent_targets'] + groups['ai_agent_key_only']) }}
          dkadi_grant={{ inventory_hostname in groups['dkadi_nopasswd_targets'] }}
