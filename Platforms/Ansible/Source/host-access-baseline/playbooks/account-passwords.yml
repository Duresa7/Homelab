---
- name: Set the root and dkadi account passwords
  hosts: "{{ target | default('ai_agent_targets:ai_agent_key_only') }}"
  gather_facts: true
  become: true
  # One host at a time. This is the only play in the project that writes to
  # /etc/shadow, and a wrong value here is only recoverable from the Proxmox
  # console, so it must never reach a second host.
  serial: "{{ host_access_serial | default(1) }}"
  any_errors_fatal: true
  vars:
    dkadi_user: dkadi
    dkadi_home: /home/dkadi
    # Both values are supplied at run time out of the credential item and never
    # live in this file, the inventory, or any tracked file. root_password is
    # the item's `sudo password #1`, which is also what a sudo prompt asks for
    # once `Defaults rootpw` lands. dkadi_password is `Standard Password`.
    root_password: ""
    dkadi_password: ""
  tasks:
    # Without this an empty variable would hash to a valid crypt string and
    # give root an empty password on all twelve hosts. It is the first thing
    # the play does, before a single account is touched.
    - name: Require both credentials before touching any account
      run_once: true
      ansible.builtin.assert:
        that:
          - root_password | length > 0
          - dkadi_password | length > 0
        fail_msg: >-
          root_password and dkadi_password must both be supplied. Read them
          out of the credential item into a mode-0600 vars file and pass it
          with -e @file. Running without them would set empty passwords.
        quiet: true

    - name: Confirm a local controller run is on ansible-01
      when:
        - inventory_hostname == 'ansible-01'
        - (ansible_connection | default('ssh')) == 'local'
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname == 'ansible-01'
        fail_msg: >-
          The ansible-01 inventory entry uses a local connection, but this
          runner reports hostname {{ ansible_facts.hostname }}. Run the project
          from ansible-01 or use an explicit SSH connection.
        quiet: true

    - name: Read the account and group databases
      ansible.builtin.getent:
        database: "{{ item }}"
      loop: [passwd, group]

    # splunk-siem is the one Rocky host and has no `sudo` group; its
    # administrative group is `wheel`. Every other host is Debian or Ubuntu.
    - name: Decide which group grants administrative rights here
      ansible.builtin.set_fact:
        dkadi_admin_group: "{{ 'sudo' if 'sudo' in ansible_facts.getent_group else 'wheel' }}"

    - name: Confirm this host has an administrative group to put dkadi in
      ansible.builtin.assert:
        that:
          - dkadi_admin_group in ansible_facts.getent_group
        fail_msg: >-
          {{ inventory_hostname }} has neither a sudo nor a wheel group, so
          there is no group membership to grant dkadi.
        quiet: true

    # update_password: always, not on_create. The point of this play is to
    # converge hosts that drifted between the credential item's two sudo
    # password fields, so it has to overwrite whatever is already there. A
    # fresh salt produces a new hash every run, which means this task reports
    # `changed` on every run. That is expected and is not an idempotency bug:
    # do not "fix" it by reverting to on_create, which would silently skip
    # every host that already has a password and leave the drift in place.
    - name: Set the root password
      ansible.builtin.user:
        name: root
        password: "{{ root_password | password_hash('sha512') }}"
        update_password: always
      no_log: true

    # Only ansible-01 lacks the account. Creating it here rather than in a
    # host-specific play keeps the twelve converging on one description.
    - name: Create the dkadi account where it does not exist
      when: dkadi_user not in ansible_facts.getent_passwd
      ansible.builtin.user:
        name: "{{ dkadi_user }}"
        shell: /bin/bash
        home: "{{ dkadi_home }}"
        create_home: true
        groups: "{{ dkadi_admin_group }}"
        # append so a host that already puts dkadi in other groups keeps them.
        append: true
        password: "{{ dkadi_password | password_hash('sha512') }}"
        update_password: always
        state: present
      no_log: true

    # Separate from the creation task on purpose: this one names only the
    # password, so a run can never change an existing account's shell, home or
    # group membership as a side effect of setting its password.
    - name: Set the dkadi password where the account already exists
      when: dkadi_user in ansible_facts.getent_passwd
      ansible.builtin.user:
        name: "{{ dkadi_user }}"
        password: "{{ dkadi_password | password_hash('sha512') }}"
        update_password: always
      no_log: true

    # ai-agent and ansible are deliberately untouched. ai-agent already carries
    # the standard password on all twelve, and ansible is a key-only service
    # account that keeps its NOPASSWD grant and stays the route back in.

    - name: Read back the root password status
      ansible.builtin.command:
        argv: [passwd, -S, root]
      register: root_passwd_status
      changed_when: false
      check_mode: false

    # Debian's shadow-utils prints P, L or NP; the Rocky host's passwd prints
    # the same first letter for a usable password. Matching on a leading P
    # accepts both and still rejects L, LK and NP.
    - name: Confirm root now has a usable password
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - root_passwd_status.stdout.split() | length > 1
          - root_passwd_status.stdout.split()[1] is match('^P')
        fail_msg: >-
          {{ inventory_hostname }}: root still reports
          {{ root_passwd_status.stdout.split()[1] | default('unreadable') }}
          rather than a usable password. Ticket 15 must not run against this
          host: Defaults rootpw with a locked root password locks every
          account out of sudo here.
        quiet: true

    - name: Read back the dkadi account's groups
      when: not ansible_check_mode
      ansible.builtin.command:
        argv: [id, -nG, "{{ dkadi_user }}"]
      register: dkadi_groups
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Confirm dkadi exists and holds administrative group membership
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - dkadi_groups.rc == 0
          - dkadi_admin_group in dkadi_groups.stdout.split()
        fail_msg: >-
          {{ inventory_hostname }}: dkadi is missing or is not in
          {{ dkadi_admin_group }}. Groups read back:
          {{ dkadi_groups.stdout | default('none') }}.
        quiet: true

    # Reading the hash back only proves a hash landed. These two tasks prove
    # the passwords actually authenticate.
    #
    # become always escalates from the connection user, which is `ansible`, so
    # this really is `su` from an unprivileged account and really does have to
    # answer a password prompt. That is what makes it a proof. If it ever ran
    # as root instead, su would not prompt at all and the check would pass
    # without testing anything.
    #
    # raw rather than command: becoming an unprivileged user needs no remote
    # temporary file this way, and the password reaches su through the become
    # plugin rather than through any command string.
    - name: Prove the root password authenticates
      when: not ansible_check_mode
      become: true
      become_method: su
      become_user: root
      vars:
        ansible_become_password: "{{ root_password }}"
      ansible.builtin.raw: id -un
      register: root_auth
      changed_when: false
      failed_when: false
      no_log: true

    - name: Confirm root authenticated
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - root_auth.stdout is defined
          - "'root' in root_auth.stdout"
        fail_msg: >-
          {{ inventory_hostname }}: su to root did not authenticate with the
          supplied password. The hash may have landed but the value is wrong.
          Do not run ticket 15 against this host.
        quiet: true

    - name: Prove the dkadi password authenticates
      when: not ansible_check_mode
      become: true
      become_method: su
      become_user: "{{ dkadi_user }}"
      vars:
        ansible_become_password: "{{ dkadi_password }}"
      ansible.builtin.raw: id -un
      register: dkadi_auth
      changed_when: false
      failed_when: false
      no_log: true

    - name: Confirm dkadi authenticated
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - dkadi_auth.stdout is defined
          - dkadi_user in dkadi_auth.stdout
        fail_msg: >-
          {{ inventory_hostname }}: su to {{ dkadi_user }} did not authenticate
          with the supplied password.
        quiet: true

    # Automation must not have been disturbed. sudo -n exits non-zero rather
    # than prompting, so a host whose ansible grant broke fails here instead of
    # hanging, and any_errors_fatal stops the run before the next host.
    - name: Confirm the ansible account still holds passwordless sudo
      when: not ansible_check_mode
      become: false
      # "true" stays quoted. Unquoted, YAML reads it as a boolean and Ansible
      # passes the string True to sudo, which is not a command.
      ansible.builtin.command:
        argv: [sudo, -n, "true"]
      changed_when: false

    - name: Report the per-host result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          root={{ root_passwd_status.stdout.split()[1] | default('unknown') }}
          root_auth={{ 'ok' if (root_auth.stdout | default('') is search('root')) else 'not tested' }}
          dkadi_groups={{ dkadi_groups.stdout | default('unknown') }}
          dkadi_auth={{ 'ok' if (dkadi_auth.stdout | default('') is search(dkadi_user)) else 'not tested' }}
