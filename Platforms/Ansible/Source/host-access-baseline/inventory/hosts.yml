---
# Host access baseline inventory for ansible-01.
#
# This project owns accounts and sudo policy. Key placement stays in
# ssh-key-automation, so nothing here writes an authorized_keys file for an
# identity that project manages. The one key file this project does write
# belongs to the ai-agent account it creates.
#
# Every host connects as `ansible`, which already holds passwordless root on
# each of them. ansible-01 runs through the guarded local connection.
#
# The Proxmox nodes are absent on purpose. This project creates POSIX accounts
# on guests; node root access is the cluster-backed key file that
# ssh-key-automation owns.
#
# Two Linux hosts are deliberately outside the model and appear in no group:
# ubuntu-dev is the single-account workstation, and docker-main stays
# root-login only. See the README.
#
# The Wazuh host is security-01, matching every other Ansible project and
# SSH Manager.
all:
  children:
    # Full treatment: create the ai-agent account, then install its key.
    ai_agent_targets:
      hosts:
        media-01:
          ansible_host: 192.168.40.42
          ansible_user: ansible
        docker-network:
          ansible_host: 192.168.85.2
          ansible_user: ansible
        monitor-01:
          ansible_host: 192.168.73.2
          ansible_user: ansible
        edge-01:
          ansible_host: 192.168.30.10
          ansible_user: ansible
        app-01:
          ansible_host: 192.168.80.10
          ansible_user: ansible
        alpha-prod-01:
          ansible_host: 192.168.80.118
          ansible_user: ansible
        security-01:
          ansible_host: 192.168.72.2
          ansible_user: ansible
        splunk-siem:
          ansible_host: 192.168.72.3
          ansible_user: ansible
        docker-blue:
          ansible_host: 192.168.40.39
          ansible_user: ansible
        ansible-01:
          ansible_host: 192.168.40.36
          ansible_user: ansible
          ansible_connection: local

    # No retained hosts need key-only onboarding.
    ai_agent_key_only:
      hosts: {}

    # The six hosts where dkadi still authenticates for sudo. The other dkadi
    # hosts already have a NOPASSWD drop-in and are not listed.
    dkadi_nopasswd_targets:
      hosts:
        edge-01:
        app-01:
        alpha-prod-01:
        security-01:
        splunk-siem:
        docker-blue:
