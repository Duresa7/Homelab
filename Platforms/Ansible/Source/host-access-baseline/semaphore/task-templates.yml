---
project:
  name: Host-Access-Baseline
  repository:
    name: host-access-baseline
    path: /home/ansible/host-access-baseline
  inventory:
    name: homelab-host-access-hosts
    path: /home/ansible/host-access-baseline/inventory/hosts.yml
    credential: ansible-key
  environment:
    name: C UTF-8
    variables:
      LANG: C.utf8
      LC_ALL: C.utf8

views:
  - All
  - AI Agent Account
  - Sudo Policy
  - Account Passwords

templates:
  - name: "AI Agent: Create Accounts and Install Key (dry run)"
    view: AI Agent Account
    playbook: playbooks/ai-agent-account.yml
    arguments: ["--check"]
  - name: "AI Agent: Create Accounts and Install Key"
    view: AI Agent Account
    playbook: playbooks/ai-agent-account.yml
    arguments: []
    survey:
      - name: ai_agent_password
        title: Console password for ai-agent
        description: >-
          From the credential item the Linux Host Baseline Standard names. Only
          applied when the account is created; leave empty to create a key-only
          account with a locked password.
        type: secret
        required: false
        values: []
  - name: "AI Agent: Single Host"
    view: AI Agent Account
    playbook: playbooks/ai-agent-account.yml
    arguments: []
    survey:
      - name: target
        title: Target host or group
        description: Inventory host name such as media-01, or a group name.
        type: ""
        required: true
        values: []

  # The current sudo policy. Defaults rootpw points every sudo prompt on the
  # host at root's password, so both values are required: root's to prove the
  # prompt accepts it, the login password to prove the prompt now refuses it.
  # The play proves root's password authenticates on each host before it writes
  # anything there, and stops the run on the first host that cannot prove it.
  - name: "Sudo Policy: Point sudo at the root password (dry run)"
    view: Sudo Policy
    playbook: playbooks/sudoers-rootpw.yml
    arguments: ["--check"]
    survey:
      - name: root_password
        title: Root password
        description: >-
          Root's password, from the field the Linux Host Baseline Standard
          names. This is what every sudo prompt on the eleven guests asks for
          once this play has run.
        type: secret
        required: true
        values: []
      - name: dkadi_password
        title: dkadi password
        description: >-
          The standard login password, from the field the Linux Host Baseline
          Standard names. Used only to prove it is refused at a sudo prompt.
        type: secret
        required: true
        values: []
  - name: "Sudo Policy: Point sudo at the root password"
    view: Sudo Policy
    playbook: playbooks/sudoers-rootpw.yml
    arguments: []
    survey:
      - name: root_password
        title: Root password
        description: >-
          Root's password, from the field the Linux Host Baseline Standard
          names. This is what every sudo prompt on the eleven guests asks for
          once this play has run.
        type: secret
        required: true
        values: []
      - name: dkadi_password
        title: dkadi password
        description: >-
          The standard login password, from the field the Linux Host Baseline
          Standard names. Used only to prove it is refused at a sudo prompt.
        type: secret
        required: true
        values: []
      - name: target
        title: Target host or group
        description: >-
          Leave at the default to run all eleven guests. An inventory host name
          such as media-01 limits the run to one host, which is how a rebuilt
          host is brought back to the policy.
        type: ""
        required: false
        values: []

  # SUPERSEDED 2026-08-15. The play these point at grants passwordless sudo to
  # dkadi and ai-agent, which the 2026-08-15 decision reverses. The play now
  # refuses to run without an explicit acknowledgement variable, so these
  # templates fail on their first task rather than doing anything. They are
  # kept, and kept named, so nobody re-creates them from the old plan.
  - name: "Sudo Policy (SUPERSEDED): Write NOPASSWD Drop-ins (dry run)"
    view: Sudo Policy
    playbook: playbooks/sudoers-nopasswd.yml
    arguments: ["--check"]
  - name: "Sudo Policy (SUPERSEDED): Write NOPASSWD Drop-ins"
    view: Sudo Policy
    playbook: playbooks/sudoers-nopasswd.yml
    arguments: []
  - name: "Sudo Policy (SUPERSEDED): Single Host"
    view: Sudo Policy
    playbook: playbooks/sudoers-nopasswd.yml
    arguments: []
    survey:
      - name: target
        title: Target host or group
        description: >-
          Superseded. This play is not the current sudo policy; see the fleet
          access priority in the root TODO before running anything here.
        type: ""
        required: true
        values: []

  # Both passwords are required. The play refuses to run without them rather
  # than hashing an empty string into /etc/shadow, so there is no dry run that
  # is useful without supplying them.
  - name: "Account Passwords: Set root and dkadi (dry run)"
    view: Account Passwords
    playbook: playbooks/account-passwords.yml
    arguments: ["--check"]
    survey:
      - name: root_password
        title: Root password
        description: >-
          Root's password, from the field the Linux Host Baseline Standard
          names. Becomes root's password on all eleven guests, and therefore
          what every sudo prompt asks for once Defaults rootpw lands.
        type: secret
        required: true
        values: []
      - name: dkadi_password
        title: dkadi password
        description: >-
          The standard login password, from the field the Linux Host Baseline
          Standard names.
        type: secret
        required: true
        values: []
  - name: "Account Passwords: Set root and dkadi"
    view: Account Passwords
    playbook: playbooks/account-passwords.yml
    arguments: []
    survey:
      - name: root_password
        title: Root password
        description: >-
          Root's password, from the field the Linux Host Baseline Standard
          names. Becomes root's password on all eleven guests, and therefore
          what every sudo prompt asks for once Defaults rootpw lands.
        type: secret
        required: true
        values: []
      - name: dkadi_password
        title: dkadi password
        description: >-
          The standard login password, from the field the Linux Host Baseline
          Standard names.
        type: secret
        required: true
        values: []
      - name: target
        title: Target host or group
        description: >-
          Leave at the default to run all retained targets. An inventory host
          name such as media-01 limits the run to one host.
        type: ""
        required: false
        values: []
