---
- name: Select the authorized-key account and path for this identity
  ansible.builtin.set_fact:
    ssh_effective_authorized_key_user: >-
      {{
        hostvars['localhost'].ssh_identity_definition.posix_account
        | default(ssh_authorized_key_user | default(ansible_user), true)
      }}
    ssh_effective_authorized_keys_path: >-
      {{
        hostvars['localhost'].ssh_identity_definition.authorized_keys_path
        | default(ssh_authorized_keys_path, true)
      }}
    ssh_effective_authorized_key_options: >-
      {{
        hostvars['localhost'].ssh_identity_authorized_key_options
        | default('', true)
      }}
