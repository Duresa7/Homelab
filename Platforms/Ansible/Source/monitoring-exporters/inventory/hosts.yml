---
# Monitoring exporter inventory for ansible-01.
#
# Scope is deliberate and differs from fleet-updates next door.
#
# node_exporter_targets holds only the hosts that NEED the exporter installed.
# grey-server, purple-server, blue-server and red-server are absent because the
# 2026-07-13 baseline cleanup already installed it there, and this project does
# not touch hypervisors. edge-01 and security-01 are absent for the same
# reason: both already export on 9100. app-01 is absent because it runs its own
# manually installed node_exporter.service binary already bound to 9100;
# adding the Debian package there would collide with a working listener.
#
# cadvisor_targets holds all eight Docker hosts. It held only docker-main from
# 2026-07-25 to 2026-07-26, because cAdvisor v0.52.1 registers no containers
# under Docker 29's default `overlayfs` driver and docker-main was the one host
# still on legacy `overlay2`. cAdvisor v0.60.5 handles the containerd snapshotter,
# so the driver no longer decides anything and the six came back.
#
# Excluded, with the reason:
#   splunk-siem  -- runs Podman, not Docker
#   ansible-01   -- runs no containers
#   kasm-01      -- runs node_exporter as of 2026-07-28 but stays out of
#                   cadvisor_targets. Its containers are disposable lab
#                   sessions, and a second listener means a second inbound
#                   path into the lane that holds them
#
# The playbook counts what cAdvisor actually registered after installing and
# fails when a host with running containers reports none, so a regression in any
# future image stops the play instead of quietly collecting root-cgroup data.
#
# The collectors package (prometheus-node-exporter-collectors) is deliberately
# NOT installed on these hosts. Its smartmon script finds no block devices
# inside an LXC or on a virtio disk, which would leave
# node_textfile_scrape_error stuck at 1 and report a permanent fault that is
# not real.
all:
  children:
    node_exporter_targets:
      hosts:
        docker-main:
          ansible_host: 192.168.40.35
          ansible_user: ansible
        docker-network:
          ansible_host: 192.168.85.2
          ansible_user: ansible
        docker-blue:
          ansible_host: 192.168.40.39
          ansible_user: ansible
        media-01:
          ansible_host: 192.168.40.42
          ansible_user: ansible
        alpha-prod-01:
          ansible_host: 192.168.80.118
          ansible_user: ansible
        splunk-siem:
          ansible_host: 192.168.72.3
          ansible_user: ansible
        ansible-01:
          # The controller manages itself. A local connection avoids depending
          # on the controller's own key being present in its own
          # authorized_keys.
          ansible_host: 192.168.40.36
          ansible_user: ansible
          ansible_connection: local
        monitor-01:
          ansible_host: 192.168.73.2
          ansible_user: ansible
        kasm-01:
          # Added 2026-07-28, after the move to purple-server settled its
          # address on LAB-MGMT VLAN 78.
          #
          # The exporter binds this one address instead of 0.0.0.0. kasm-01
          # holds macvlan shim addresses in VLANs 74, 77 and 79, and a session
          # container sharing one of those subnets would reach an
          # all-interfaces listener directly, with no gateway in the path to
          # stop it.
          #
          # The dedicated ansible account was provisioned here on 2026-07-28,
          # then cut back below the fleet pattern on purpose. It is in no
          # supplementary groups: not sudo, and not docker, since docker
          # membership is root-equivalent through a host bind mount and this
          # play never touches Docker. Its sudoers drop-in reads
          # `ansible ALL=(root) NOPASSWD: ALL` rather than (ALL:ALL).
          #
          # Command allowlisting is not possible here. Ansible escalates through
          # `sudo -u root /bin/sh -c '<token>; python3'`, so any grant that lets
          # this play run is equivalent to root. The controls that do bite are
          # the from= restriction on the key and the absence of group
          # privileges.
          ansible_host: 192.168.78.10
          ansible_user: ansible
          node_exporter_listen_override: "192.168.78.10:9100"
          node_exporter_probe_override: "192.168.78.10"
        game-01:
          # Added 2026-08-07 with the Pelican game server platform. Ordinary
          # all-interfaces listener: unlike kasm-01 this host holds a single
          # address on SERVERS-A and runs no macvlan lanes.
          ansible_host: 192.168.80.30
          ansible_user: ansible

    cadvisor_targets:
      hosts:
        docker-main:
          ansible_host: 192.168.40.35
          ansible_user: ansible
        docker-network:
          ansible_host: 192.168.85.2
          ansible_user: ansible
        docker-blue:
          ansible_host: 192.168.40.39
          ansible_user: ansible
        media-01:
          ansible_host: 192.168.40.42
          ansible_user: ansible
        alpha-prod-01:
          ansible_host: 192.168.80.118
          ansible_user: ansible
        app-01:
          ansible_host: 192.168.80.10
          ansible_user: ansible
        security-01:
          ansible_host: 192.168.72.2
          ansible_user: ansible
        monitor-01:
          ansible_host: 192.168.73.2
          ansible_user: ansible
        game-01:
          # Wings creates one Docker container per game server, so per-container
          # metrics are the only way to read a single server's memory and CPU
          # against the limit the panel assigned it.
          ansible_host: 192.168.80.30
          ansible_user: ansible
