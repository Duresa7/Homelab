---
# Monitoring exporter inventory for ansible-01.
#
# Scope is deliberate and differs from fleet-updates next door.
#
# node_exporter_targets holds only the hosts that NEED the exporter installed.
# grey-server, purple-server, blue-server and red-server are absent because the
# 2026-07-13 baseline cleanup already installed it there, and this project does
# not touch hypervisors. edge-01 and security-01 are absent for the same
# reason: both already export on 9100. app-01 is absent because it runs its own
# manually installed node_exporter.service binary already bound to 9100;
# adding the Debian package there would collide with a working listener.
#
# cadvisor_targets holds all nine Docker hosts. It held only docker-main from
# 2026-07-25 to 2026-07-26, because cAdvisor v0.52.1 registers no containers
# under Docker 29's default `overlayfs` driver and docker-main was the one host
# still on legacy `overlay2`. cAdvisor v0.60.5 handles the containerd snapshotter,
# so the driver no longer decides anything and the full Docker fleet came back.
#
# Excluded, with the reason:
#   splunk-siem  -- runs Podman, not Docker
#   ansible-01   -- runs no containers
#
# The playbook counts what cAdvisor actually registered after installing and
# fails when a host with running containers reports none, so a regression in any
# future image stops the play instead of quietly collecting root-cgroup data.
#
# The collectors package (prometheus-node-exporter-collectors) is deliberately
# NOT installed on these hosts. Its smartmon script finds no block devices
# inside an LXC or on a virtio disk, which would leave
# node_textfile_scrape_error stuck at 1 and report a permanent fault that is
# not real.
all:
  children:
    node_exporter_targets:
      hosts:
        docker-main:
          ansible_host: 192.168.40.35
          ansible_user: ansible
        docker-network:
          ansible_host: 192.168.85.2
          ansible_user: ansible
        docker-blue:
          ansible_host: 192.168.40.39
          ansible_user: ansible
        media-01:
          ansible_host: 192.168.40.42
          ansible_user: ansible
        alpha-prod-01:
          ansible_host: 192.168.80.118
          ansible_user: ansible
        splunk-siem:
          ansible_host: 192.168.72.3
          ansible_user: ansible
        ansible-01:
          # The controller manages itself. A local connection avoids depending
          # on the controller's own key being present in its own
          # authorized_keys.
          ansible_host: 192.168.40.36
          ansible_user: ansible
          ansible_connection: local
        monitor-01:
          ansible_host: 192.168.73.2
          ansible_user: ansible
        db-13-dev:
          # Added 2026-08-08, when this guest became my development workstation.
          # Excluded from cadvisor_targets on purpose: the containers here are
          # throwaway development builds, so per-container history is noise and
          # a second inbound listener buys nothing.
          #
          # ansible_user is ai-agent, not ansible. This host runs one account
          # for me and for agent work by design, so no separate ansible account
          # exists to target.
          ansible_host: 192.168.40.135
          ansible_user: ai-agent

    cadvisor_targets:
      hosts:
        docker-main:
          ansible_host: 192.168.40.35
          ansible_user: ansible
        docker-network:
          ansible_host: 192.168.85.2
          ansible_user: ansible
        docker-blue:
          ansible_host: 192.168.40.39
          ansible_user: ansible
        media-01:
          ansible_host: 192.168.40.42
          ansible_user: ansible
        alpha-prod-01:
          ansible_host: 192.168.80.118
          ansible_user: ansible
        app-01:
          ansible_host: 192.168.80.10
          ansible_user: ansible
        security-01:
          ansible_host: 192.168.72.2
          ansible_user: ansible
        monitor-01:
          ansible_host: 192.168.73.2
          ansible_user: ansible
    # Hosts whose node_exporter is the upstream binary rather than the Debian
    # package, so nothing ever gave them a textfile collector directory or the
    # prometheus-node-exporter-collectors scripts that write into it. The
    # twelve package-managed hosts already publish apt_upgrades_pending and
    # node_reboot_required this way; these six did not, and the update alerts
    # need every host to report. Added 2026-09-02.
    #
    # grey-server is the one hypervisor here and connects as root, the same way
    # ssh-key-automation does, because a Proxmox node has no ansible account.
    # It is also the only bare-metal member, so it is the only one that gets
    # nvme-cli and the smartmon and nvme timers: inside a guest those scripts
    # see the host's devices and cannot read them.
    textfile_collector_targets:
      hosts:
        grey-server:
          ansible_host: 192.168.70.10
          ansible_user: root
        docker-main:
          ansible_host: 192.168.40.35
          ansible_user: ansible
        app-01:
          ansible_host: 192.168.80.10
          ansible_user: ansible
        edge-01:
          ansible_host: 192.168.30.10
          ansible_user: ansible
        security-01:
          ansible_host: 192.168.72.2
          ansible_user: ansible
        splunk-siem:
          # Rocky Linux, so it gets the dnf script rather than the Debian
          # collectors package.
          ansible_host: 192.168.72.3
          ansible_user: ansible

    # What's Up Docker, one per host that runs Compose projects, published on
    # 9102 next to node_exporter and cAdvisor. Same six hosts as
    # docker_compose_targets in fleet-updates. app-01 (Coolify) is absent
    # because Coolify owns its image updates. Added 2026-09-02.
    #
    # wud_cron staggers the daily registry check across hosts. Every host
    # leaves through one WAN address, and Docker Hub counts manifest requests
    # against an anonymous quota of 100 per six hours per address, so six hosts
    # checking at the same minute is how that quota gets spent on nothing.
    wud_targets:
      hosts:
        docker-main:
          ansible_host: 192.168.40.35
          ansible_user: ansible
          wud_cron: "0 6 * * *"
        docker-network:
          ansible_host: 192.168.85.2
          ansible_user: ansible
          wud_cron: "20 6 * * *"
        docker-blue:
          ansible_host: 192.168.40.39
          ansible_user: ansible
          wud_cron: "40 6 * * *"
        media-01:
          ansible_host: 192.168.40.42
          ansible_user: ansible
          wud_cron: "0 7 * * *"
        alpha-prod-01:
          ansible_host: 192.168.80.118
          ansible_user: ansible
          wud_cron: "20 7 * * *"
        monitor-01:
          ansible_host: 192.168.73.2
          ansible_user: ansible
          wud_cron: "40 7 * * *"
