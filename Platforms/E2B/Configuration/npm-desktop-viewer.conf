# Advanced configuration of NPM proxy host desktop.e2b.alphasecunited.com.
# A browser cannot add the E2b-Sandbox-Id and E2b-Sandbox-Port headers that
# client-proxy routes on, and UniFi local DNS cannot answer the per-sandbox
# names (6080-<id>.e2b.alphasecunited.com) the Desktop SDK builds. This takes
# the sandbox ID from the first path segment instead and sets both headers, so
#   https://desktop.e2b.alphasecunited.com/<id>/vnc.html?autoconnect=1&path=<id>/websockify
# opens that sandbox's noVNC (port 6080) and its WebSocket.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

location ~ "^/(?<e2b_sbx>[a-z0-9]{15,40})/(?<e2b_rest>.*)$" {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    # client-proxy answers 400 "invalid host" to desktop.e2b.alphasecunited.com
    # before it reads the routing headers; the sandbox host's name passes.
    proxy_set_header Host sandbox.e2b.alphasecunited.com;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header E2b-Sandbox-Id $e2b_sbx;
    proxy_set_header E2b-Sandbox-Port 6080;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://192.168.80.30:3002/$e2b_rest$is_args$args;
}
