# ssh-mcp 2.22.0 configuration for docker-blue.
#
# Live copy: /opt/docker/ssh-mcp/config/config.toml, owned by UID 65532, mode 0600, in a
# 0700 directory; ssh-mcp refuses to start otherwise. Scripts/pin-host-keys.py writes the
# live copy from this file and adds a trustedHostKey pin to every profile from the host's
# known_hosts. The pins are not tracked here.
#
# Access matches the SSH Manager setup this replaced on 2026-10-31: every profile is
# admin on one custom tier that holds all four command classes, and nothing waits for an
# approval. ssh-mcp's built-in never-allowed list still applies and cannot be configured
# away (shutdown, reboot, halt, poweroff, eval, mkfs, writes naming /etc/cron*,
# /etc/systemd or authorized_keys, and a few more).

[defaults]
# A call that names no profile runs here, on the workstation the agents run on.
defaultProfile = "ubuntu_dev"
approvalMode = "auto"
commandTimeoutMs = 240000
commandMaxChars = 0
commandMaxOutputBytes = 1048576
approvalGrantTtlMs = 0
commandQuotaPerDay = 0

[policy.roleBindings.admin]
homelab = ["read-only", "safe", "destructive", "privileged"]

# Alpha Production 01 (Debian 13), docker-compose services
