# Applied on all six remote hosts on 2026-09-15.
# The maintenance profile keeps the updater stopped during normal stack deploys.
services:
  hawser:
    image: ghcr.io/finsys/hawser:latest
    labels:
      dockhand.update: "false"
  hawser-updater:
    image: docker:29-cli
    container_name: hawser-updater
    profiles: [maintenance]
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/docker/hawser/update-hawser.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/docker:/opt/docker:ro
