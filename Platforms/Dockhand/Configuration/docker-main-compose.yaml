name: dockhand
services:
  dockhand:
    image: fnsys/dockhand:v1.0.51@sha256:ffba7083c8d28ae7afdc3c30e89ee03d43fa6ee99c335ee25e8cfab8b767f431
    container_name: dockhand
    restart: unless-stopped
    ports:
      - "192.168.40.35:3003:3000"
    environment:
      DATA_DIR: /opt/docker/dockhand/data
      STACKS_DIR: /opt/docker/dockhand/stacks
      ORIGIN: https://dockhand.alphasecunited.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/docker:/opt/docker
