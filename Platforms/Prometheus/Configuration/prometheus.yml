# Prometheus scrape configuration, deployed at
# /home/<YOUR_ADMIN_USERNAME>/monitoring/prometheus.yml on monitor-01.
#
# DO NOT COPY THIS FILE ONTO monitor-01 AS-IS. This is the scrubbed reference
# copy: the 19 blackbox probe targets here read `<YOUR_BASE_DOMAIN>`, which
# resolves to nothing. Uploading it verbatim on 2026-07-28 took all 19 probes
# down until the real domain was substituted back in. Edit the deployed file in
# place, or substitute the real base domain before copying.
#
# Job naming: one job per exporter type, with the hostname carried in a `host`
# label. The earlier layout used one job per host, which made `job` double as a
# hostname. That stopped scaling at 14 node_exporter targets across five
# exporter types. Changing it breaks graph continuity for series that existed
# before the switch; with 15-day retention that discontinuity ages out.
#
# Publication note: the blackbox target list carries a redaction placeholder in
# the repository copy and the real internal base domain in the deployed copy.
global:
  scrape_interval: 15s

scrape_configs:
  # ------------------------------------------------------------------ node
  # Every running Linux host that carries a workload. kasm-01 joined on
  # 2026-07-28; its exporter binds 192.168.78.10 alone rather than 0.0.0.0,
  # because that host also holds macvlan shim addresses inside three sealed lab
  # lanes and a session container on one of those subnets would otherwise read
  # host metrics with no gateway in the path.
  - job_name: node
    static_configs:
      - targets: ["192.168.70.10:9100"]
        labels: {host: grey-server, role: hypervisor}
      - targets: ["192.168.70.11:9100"]
        labels: {host: purple-server, role: hypervisor}
      - targets: ["192.168.70.12:9100"]
        labels: {host: blue-server, role: hypervisor}
      - targets: ["192.168.70.13:9100"]
        labels: {host: red-server, role: hypervisor}
      - targets: ["192.168.72.2:9100"]
        labels: {host: security-01, role: security}
      - targets: ["192.168.72.3:9100"]
        labels: {host: splunk-siem, role: security}
      - targets: ["192.168.90.10:9100"]
        labels: {host: edge-01, role: edge}
      - targets: ["192.168.40.35:9100"]
        labels: {host: docker-main, role: docker}
      - targets: ["192.168.40.36:9100"]
        labels: {host: ansible-01, role: automation}
      - targets: ["192.168.40.39:9100"]
        labels: {host: docker-blue, role: docker}
      - targets: ["192.168.40.42:9100"]
        labels: {host: media-01, role: docker}
      - targets: ["192.168.80.10:9100"]
        labels: {host: app-01, role: app}
      - targets: ["192.168.80.118:9100"]
        labels: {host: alpha-prod-01, role: app}
      - targets: ["192.168.85.2:9100"]
        labels: {host: docker-network, role: docker}
      - targets: ["192.168.73.2:9100"]
        labels: {host: monitor-01, role: monitoring}
      - targets: ["192.168.78.10:9100"]
        labels: {host: kasm-01, role: lab}

  # -------------------------------------------------------------- cadvisor
  # Per-container CPU, memory and restart detection across all eight Docker
  # hosts.
  #
  # This job listed docker-main alone from 2026-07-25 to 2026-07-26. cAdvisor
  # v0.52.1 resolves a container's read-write layer through the old graphdriver
  # layerdb path, which does not exist under Docker 29's default `overlayfs`
  # driver (the containerd snapshotter), and the lookup runs during registration
  # rather than during collection, so it abandoned every container and reported
  # only the root cgroup. docker-main was the one host still on `overlay2`.
  # v0.60.5 from ghcr.io/google/cadvisor handles the snapshotter, so the driver
  # no longer decides anything. See the troubleshooting record "cAdvisor
  # Registers No Containers Under the Docker 29 overlayfs Driver".
  #
  # 30s rather than 15s: container detail does not need 15-second resolution.
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["192.168.40.35:9101"]
        labels: {host: docker-main, role: docker}
      - targets: ["192.168.85.2:9101"]
        labels: {host: docker-network, role: docker}
      - targets: ["192.168.40.39:9101"]
        labels: {host: docker-blue, role: docker}
      - targets: ["192.168.40.42:9101"]
        labels: {host: media-01, role: docker}
      - targets: ["192.168.80.118:9101"]
        labels: {host: alpha-prod-01, role: app}
      - targets: ["192.168.80.10:9101"]
        labels: {host: app-01, role: app}
      - targets: ["192.168.72.2:9101"]
        labels: {host: security-01, role: security}
      - targets: ["192.168.73.2:9101"]
        labels: {host: monitor-01, role: monitoring}

  # --------------------------------------------------------------- proxmox
  # The PVE API exporter. This one job covers the whole cluster: every guest's
  # CPU, memory, disk and running state, all ten storages, node status and
  # quorum. Unchanged from the previous configuration.
  - job_name: proxmox
    static_configs:
      - targets: ["192.168.70.10"]
    metrics_path: /pve
    params:
      module: [default]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: pve-exporter:9221

  # -------------------------------------------------------------- blackbox
  # Probes each internal service name through NPM, so a failure means the path a
  # person actually uses is broken: local DNS, the proxy, the certificate, or the
  # backend. 60s because uptime does not need 15-second resolution, and it keeps
  # the probe load on NPM to 20 requests a minute.
  - job_name: blackbox
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://jellyfin.<YOUR_BASE_DOMAIN>/
          - https://seerr.<YOUR_BASE_DOMAIN>/
          - https://sonarr.<YOUR_BASE_DOMAIN>/
          - https://radarr.<YOUR_BASE_DOMAIN>/
          - https://prowlarr.<YOUR_BASE_DOMAIN>/
          - https://qbittorrent.<YOUR_BASE_DOMAIN>/
          - https://semaphore.<YOUR_BASE_DOMAIN>/
          - https://immich.<YOUR_BASE_DOMAIN>/
          - https://booklore.<YOUR_BASE_DOMAIN>/
          - https://dashboard.<YOUR_BASE_DOMAIN>/
          - https://forgejo.<YOUR_BASE_DOMAIN>/
          - https://portainer.<YOUR_BASE_DOMAIN>/
          - https://peanut.<YOUR_BASE_DOMAIN>/
          - https://syncthing.<YOUR_BASE_DOMAIN>/
          - https://wazuh.<YOUR_BASE_DOMAIN>/
          - https://grafana.<YOUR_BASE_DOMAIN>/
          - https://prometheus.<YOUR_BASE_DOMAIN>/
          - https://splunk.<YOUR_BASE_DOMAIN>/
          - https://ts3-manager.<YOUR_BASE_DOMAIN>/
          - https://kasm.<YOUR_BASE_DOMAIN>/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ------------------------------------------------------------ prometheus
  # Self-scrape, so target health, scrape duration and TSDB growth are queryable
  # from the dashboard rather than only from the Prometheus UI.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: {host: monitor-01, role: monitoring}

  # ------------------------------------------------------------------- nut
  # Both APC Back-UPS Pro BR1500MS2 units, read over the NUT protocol on 3493.
  # NUT needs no credential: upsd.users is empty on both hosts and anonymous
  # reads are permitted.
  #
  # Reaching this needed rules in two independent firewalls. The UniFi policy
  # "Allow Security to Proxmox NUT" was not sufficient on its own; the Proxmox
  # cluster firewall at /etc/pve/firewall/cluster.fw also had to permit
  # 192.168.73.2, since it previously allowed only docker-main for PeaNUT.
  #
  # 30s because UPS state changes slowly, and a brownout lasting under 30
  # seconds is not something this dashboard needs to resolve.
  - job_name: nut
    scrape_interval: 30s
    metrics_path: /nut
    static_configs:
      - targets: ["192.168.70.13:3493"]
        labels: {host: red-server, ups: ups01}
      - targets: ["192.168.70.10:3493"]
        labels: {host: grey-server, ups: ups02}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: nut-exporter:9995
