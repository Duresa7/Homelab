# Prometheus scrape configuration, deployed at
# /home/dkadi/monitoring/prometheus-config/prometheus.yml on monitor-01.
#
# Job naming: one job per exporter type, with the hostname carried in a `host`
# label. The earlier layout used one job per host, which made `job` double as a
# hostname. The current configuration has 18 node_exporter targets and seven
# jobs overall. Changing it breaks graph continuity for series that existed
# before the switch; with 15-day retention that discontinuity ages out.
global:
  scrape_interval: 15s

scrape_configs:
  # ------------------------------------------------------------------ node
  # Every running Linux host that carries a workload.
  - job_name: node
    static_configs:
      - targets: ["192.168.70.10:9100"]
        labels: {host: grey-server, role: hypervisor}
      - targets: ["192.168.70.11:9100"]
        labels: {host: purple-server, role: hypervisor}
      - targets: ["192.168.70.12:9100"]
        labels: {host: blue-server, role: hypervisor}
      - targets: ["192.168.70.13:9100"]
        labels: {host: red-server, role: hypervisor}
      - targets: ["192.168.70.14:9100"]
        labels: {host: green-server, role: hypervisor}
      - targets: ["192.168.72.2:9100"]
        labels: {host: security-01, role: security}
      - targets: ["192.168.72.3:9100"]
        labels: {host: splunk-siem, role: security}
      - targets: ["192.168.30.10:9100"]
        labels: {host: edge-01, role: edge}
      - targets: ["192.168.40.35:9100"]
        labels: {host: docker-main, role: docker}
      - targets: ["192.168.40.36:9100"]
        labels: {host: ansible-01, role: automation}
      - targets: ["192.168.40.39:9100"]
        labels: {host: docker-blue, role: docker}
      - targets: ["192.168.40.42:9100"]
        labels: {host: media-01, role: docker}
      - targets: ["192.168.80.10:9100"]
        labels: {host: app-01, role: app}
      - targets: ["192.168.80.118:9100"]
        labels: {host: alpha-prod-01, role: app}
      - targets: ["192.168.85.2:9100"]
        labels: {host: docker-network, role: docker}
      - targets: ["192.168.73.2:9100"]
        labels: {host: monitor-01, role: monitoring}
      - targets: ["192.168.80.30:9100"]
        labels: {host: game-01, role: game}
      - targets: ["192.168.40.179:9100"]
        labels: {host: ubuntu-dev, role: workstation}

  # -------------------------------------------------------------- cadvisor
  # Per-container CPU, memory and restart detection across all nine Docker
  # hosts.
  #
  # This job listed docker-main alone from 2026-07-25 to 2026-07-26. cAdvisor
  # v0.52.1 resolves a container's read-write layer through the old graphdriver
  # layerdb path, which does not exist under Docker 29's default `overlayfs`
  # driver (the containerd snapshotter), and the lookup runs during registration
  # rather than during collection, so it abandoned every container and reported
  # only the root cgroup. docker-main was the one host still on `overlay2`.
  # v0.60.5 from ghcr.io/google/cadvisor handles the snapshotter, so the driver
  # no longer decides anything. See the troubleshooting record "cAdvisor
  # Registers No Containers Under the Docker 29 overlayfs Driver".
  #
  # 30s rather than 15s: container detail does not need 15-second resolution.
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["192.168.40.35:9101"]
        labels: {host: docker-main, role: docker}
      - targets: ["192.168.85.2:9101"]
        labels: {host: docker-network, role: docker}
      - targets: ["192.168.40.39:9101"]
        labels: {host: docker-blue, role: docker}
      - targets: ["192.168.40.42:9101"]
        labels: {host: media-01, role: docker}
      - targets: ["192.168.80.118:9101"]
        labels: {host: alpha-prod-01, role: app}
      - targets: ["192.168.80.10:9101"]
        labels: {host: app-01, role: app}
      - targets: ["192.168.72.2:9101"]
        labels: {host: security-01, role: security}
      - targets: ["192.168.73.2:9101"]
        labels: {host: monitor-01, role: monitoring}
      - targets: ["192.168.80.30:9101"]
        labels: {host: game-01, role: game}

  # ------------------------------------------------------------------- wud
  # What's Up Docker on the six Compose hosts. One gauge row per container
  # with an update_available label; the Grafana rule "Container image has an
  # update" reads it. WUD checks the registries once a day on a staggered cron,
  # so a five-minute scrape loses nothing. Managed by the monitoring-exporters
  # Ansible project, published on 9102 beside node_exporter and cAdvisor.
  # Added 2026-09-02.
  - job_name: wud
    scrape_interval: 5m
    static_configs:
      - targets: ["192.168.40.35:9102"]
        labels: {host: docker-main, role: docker}
      - targets: ["192.168.85.2:9102"]
        labels: {host: docker-network, role: docker}
      - targets: ["192.168.40.39:9102"]
        labels: {host: docker-blue, role: docker}
      - targets: ["192.168.40.42:9102"]
        labels: {host: media-01, role: docker}
      - targets: ["192.168.80.118:9102"]
        labels: {host: alpha-prod-01, role: app}
      - targets: ["192.168.73.2:9102"]
        labels: {host: monitor-01, role: monitoring}

  # --------------------------------------------------------------- proxmox
  # The PVE API exporter. This one job covers the whole cluster: every guest's
  # CPU, memory, disk and running state, all ten storages, node status and
  # quorum. Unchanged from the previous configuration.
  - job_name: proxmox
    static_configs:
      - targets: ["192.168.70.10"]
    metrics_path: /pve
    params:
      module: [default]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: pve-exporter:9221

  # -------------------------------------------------------------- blackbox
  # Probes each internal service name through NPM, so a failure means the path a
  # person actually uses is broken: local DNS, the proxy, the certificate, or the
  # backend. 60s because uptime does not need 15-second resolution, and it keeps
  # the probe load on NPM to 21 requests a minute.
  - job_name: blackbox
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://jellyfin.alphasecunited.com/
          - https://seerr.alphasecunited.com/
          - https://sonarr.alphasecunited.com/
          - https://radarr.alphasecunited.com/
          - https://prowlarr.alphasecunited.com/
          - https://qbittorrent.alphasecunited.com/
          - https://semaphore.alphasecunited.com/
          - https://immich.alphasecunited.com/
          - https://booklore.alphasecunited.com/
          - https://dashboard.alphasecunited.com/
          - https://forgejo.alphasecunited.com/
          - https://portainer.alphasecunited.com/
          - https://peanut.alphasecunited.com/
          - https://wazuh.alphasecunited.com/
          - https://grafana.alphasecunited.com/
          - https://prometheus.alphasecunited.com/
          - https://splunk.alphasecunited.com/
          - https://ts3-manager.alphasecunited.com/
          - https://openwebui.alphasecunited.com/
          - https://games.alphasecunited.com/
          # The Discord alert bot's own health endpoint, over the Compose
          # network. /health answers 200 only while its Discord session is
          # ready, so a dead bot trips "Internal service is unreachable" rather
          # than silently swallowing every alert. Added 2026-09-02.
          - http://alert-bot:8080/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ------------------------------------------------------------ prometheus
  # Self-scrape, so target health, scrape duration and TSDB growth are queryable
  # from the dashboard rather than only from the Prometheus UI.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: {host: monitor-01, role: monitoring}

  # ------------------------------------------------------------------- nut
  # APC Back-UPS Pro BR1500MS2 UPS-02, read over NUT on TCP 3493.
  # NUT needs no credential: upsd.users is empty and anonymous reads are
  # permitted.
  #
  # Reaching this needed rules in two independent firewalls. The UniFi policy
  # "Allow Security to Proxmox NUT" was not sufficient on its own; the Proxmox
  # cluster firewall at /etc/pve/firewall/cluster.fw also had to permit
  # 192.168.73.2, since it previously allowed only docker-main for PeaNUT.
  #
  # 30s because UPS state changes slowly, and a brownout lasting under 30
  # seconds is not something this dashboard needs to resolve.
  - job_name: nut
    scrape_interval: 30s
    metrics_path: /nut
    static_configs:
      # UPS-01 is commented out as of 2026-08-31. Its USB data cable came off
      # red-server on 2026-08-28 during a UPS swap and is not plugged into any
      # node, so red-server serves no NUT data and this target sat down for
      # three and a half days. red-server now draws power from UPS-02, which
      # grey-server already reports as ups02 below, so no UPS went unmonitored
      # in the sense that matters: the unit feeding red is still on the board.
      # Restore alongside the ups.conf stanza on red-server. See TODO.md.
      # - targets: ["192.168.70.13:3493"]
      #   labels: {host: red-server, ups: ups01}
      - targets: ["192.168.70.10:3493"]
        labels: {host: grey-server, ups: ups02}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: nut-exporter:9995
