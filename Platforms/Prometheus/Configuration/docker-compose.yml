# Monitoring stack on monitor-01, deployed at
# /home/dkadi/monitoring/docker-compose.yml
#
# cAdvisor is deliberately absent here. Ansible owns it as its own compose
# project at /opt/docker/cadvisor so one playbook covers all nine Docker hosts
# identically, including this one.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=https://prometheus.alphasecunited.com
    volumes:
      # Directory bind mount, not a single file. A single-file mount pins the
      # inode at container start, so a replaced prometheus.yml stayed invisible
      # to Prometheus and SIGHUP was a silent no-op. The directory fixes that.
      - ./prometheus-config:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_DOMAIN=grafana.alphasecunited.com
      - GF_SERVER_ROOT_URL=https://grafana.alphasecunited.com
      - GF_SERVER_PROTOCOL=http
      # GF_DATABASE_WAL is deliberately absent. It worked with Grafana 12.4.1,
      # but Grafana 13 reads the variable while leaving SQLite in rollback-journal
      # mode. Detail is in Troubleshooting issue 4.
      # 12-hour clock everywhere in the UI. Grafana's [date_formats] defaults are
      # 24-hour (HH:mm), so each interval is overridden explicitly rather than
      # relying on the viewer's browser locale. Added 2026-07-28.
      - GF_DATE_FORMATS_FULL_DATE=MMM D, YYYY h:mm:ss a
      - GF_DATE_FORMATS_INTERVAL_MILLISECOND=h:mm:ss.SSS a
      - GF_DATE_FORMATS_INTERVAL_SECOND=h:mm:ss a
      - GF_DATE_FORMATS_INTERVAL_MINUTE=h:mm a
      - GF_DATE_FORMATS_INTERVAL_HOUR=MM/DD h:mm a
      - GF_DATE_FORMATS_INTERVAL_DAY=MM/DD
      - GF_DATE_FORMATS_INTERVAL_MONTH=YYYY-MM
      - GF_DATE_FORMATS_INTERVAL_YEAR=YYYY
      # Shared secret Grafana presents to the Discord alert bot as a bearer
      # token. Interpolated by Compose from the untracked mode-0600 .env beside
      # this file, then by Grafana into provisioning/alerting/contact-points.yaml
      # as $ALERT_BOT_SECRET. Added 2026-09-02.
      - ALERT_BOT_SECRET=${ALERT_BOT_SECRET}
    volumes:
      - grafana_data:/var/lib/grafana
      # Directory mounts, not single-file mounts, so the inode problem above
      # does not apply. Grafana re-reads dashboard files on its own interval, so
      # editing a dashboard JSON needs no restart after the first deploy.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: pve-exporter
    # Match the owner of the mode-0600 host credential file. The image's
    # default nobody user cannot read a bind mount owned by the admin account.
    user: "1000:1000"
    restart: unless-stopped
    volumes:
      - ./pve.yml:/etc/prometheus/pve.yml
    ports:
      - "9221:9221"

  # Probes the 19 internal service names through NPM, which tests the real user
  # path: local DNS, the proxy, the certificate, and the backend behind it.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"

  # Proxies Prometheus reads of UPS-02 from grey-server over NUT on TCP 3493.
  # NUT needs no credential here: upsd.users is empty and anonymous reads are
  # permitted. UPS-01 is absent while its data cable remains disconnected.
  nut-exporter:
    image: hon95/prometheus-nut-exporter:1
    container_name: nut-exporter
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    ports:
      - "9995:9995"

  # Discord alert bot. Grafana's only contact point posts to this container's
  # /grafana endpoint over the Compose network, and Splunk's webhook alert
  # actions post to /splunk from splunk-siem; the bot posts each alert to the
  # #bots channel as the Anubis AS bot user. Source is versioned at
  # Platforms/Discord Alert Bot/Source/ and deployed to ./alert-bot/. Both
  # secrets come from the untracked .env. Added 2026-09-02.
  #
  # 8080 is published for Splunk, which cannot send an authorization header,
  # so /splunk checks the source address instead: the bot accepts only
  # SPLUNK_SOURCE_IP, and the UniFi policy "Allow splunk-siem to alert bot"
  # is the only cross-VLAN path to this port. /grafana still needs its bearer.
  alert-bot:
    build: ./alert-bot
    image: alphasecunited/alert-bot:1
    container_name: alert-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      - ALERT_BOT_SECRET=${ALERT_BOT_SECRET}
      - SPLUNK_SOURCE_IP=192.168.72.3
      - TZ=America/New_York
    ports:
      - "8080:8080"

volumes:
  prometheus_data:
  grafana_data:
