# Monitoring stack on monitor-01, deployed at
# /home/<YOUR_ADMIN_USERNAME>/monitoring/docker-compose.yml
#
# Publication note: the three URL values below carry a redaction placeholder in
# the repository copy and the real internal base domain in the deployed copy at
# /home/<YOUR_ADMIN_USERNAME>/monitoring/. Same convention as the Ansible
# fleet-updates inventory.
#
# cAdvisor is deliberately absent here. Ansible owns it as its own compose
# project at /opt/docker/cadvisor so one playbook covers all eight Docker hosts
# identically, including this one.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=https://prometheus.<YOUR_BASE_DOMAIN>
    volumes:
      # Single-file bind mount. Replacing the host file requires a container
      # restart, not a SIGHUP: see the 2026-07-13 inode troubleshooting record.
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_DOMAIN=grafana.<YOUR_BASE_DOMAIN>
      - GF_SERVER_ROOT_URL=https://grafana.<YOUR_BASE_DOMAIN>
      - GF_SERVER_PROTOCOL=http
      # Write-ahead logging on the SQLite database. Added 2026-07-26 after 25
      # `database is locked` errors in 10 hours, spread across background jobs:
      # provisioning re-walks, alert rule saves, remote-cache GC, token and login
      # cleanup, SSO settings, snapshot expiry. In SQLite's default rollback-journal
      # mode a reader blocks the writer, and Grafana's own housekeeping runs enough
      # concurrent work to hit that on its own with a single user. WAL lets readers
      # and the writer proceed together.
      #
      # This line does nothing on Grafana 13.1.1. The setting is read and logged,
      # but the database stays in rollback-journal mode under the
      # modernc.org/sqlite driver: no -wal file, no -shm file, and header bytes 18
      # and 19 read 1 rather than 2. It worked on 12.4.1. Kept only until the
      # 2026-07-27 error count decides between removing it and setting the journal
      # mode on the file directly, because a recreate to drop it now would reset
      # the log that count reads. Detail in Troubleshooting issue 4.
      - GF_DATABASE_WAL=true
      # 12-hour clock everywhere in the UI. Grafana's [date_formats] defaults are
      # 24-hour (HH:mm), so each interval is overridden explicitly rather than
      # relying on the viewer's browser locale. Added 2026-07-28.
      - GF_DATE_FORMATS_FULL_DATE=MMM D, YYYY h:mm:ss a
      - GF_DATE_FORMATS_INTERVAL_MILLISECOND=h:mm:ss.SSS a
      - GF_DATE_FORMATS_INTERVAL_SECOND=h:mm:ss a
      - GF_DATE_FORMATS_INTERVAL_MINUTE=h:mm a
      - GF_DATE_FORMATS_INTERVAL_HOUR=MM/DD h:mm a
      - GF_DATE_FORMATS_INTERVAL_DAY=MM/DD
      - GF_DATE_FORMATS_INTERVAL_MONTH=YYYY-MM
      - GF_DATE_FORMATS_INTERVAL_YEAR=YYYY
    volumes:
      - grafana_data:/var/lib/grafana
      # Directory mounts, not single-file mounts, so the inode problem above
      # does not apply. Grafana re-reads dashboard files on its own interval, so
      # editing a dashboard JSON needs no restart after the first deploy.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: pve-exporter
    # Match the owner of the mode-0600 host credential file. The image's
    # default nobody user cannot read a bind mount owned by the admin account.
    user: "1000:1000"
    restart: unless-stopped
    volumes:
      - ./pve.yml:/etc/prometheus/pve.yml
    ports:
      - "9221:9221"

  # Probes the 20 internal service names through NPM, which tests the real user
  # path: local DNS, the proxy, the certificate, and the backend behind it.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"

  # Reads the NUT servers on red-server (ups01) and grey-server (ups02) over the
  # NUT protocol on 3493. NUT needs no credential here: upsd.users is empty on
  # both hosts and anonymous reads are permitted.
  nut-exporter:
    image: hon95/prometheus-nut-exporter:1
    container_name: nut-exporter
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    ports:
      - "9995:9995"

volumes:
  prometheus_data:
  grafana_data:
