# Where a firing alert goes, deployed at
# /home/dkadi/monitoring/grafana/provisioning/alerting/ on monitor-01.
#
# Before 2026-09-02 there was no contact point at all and the root policy's
# receiver was literally named `empty`, so every rule in alphasec-united-alerts.yaml
# evaluated into silence. This file replaces that.
#
# The receiver is the Discord alert bot, reached over the Compose network. The
# shared secret is interpolated from the Grafana container's environment; the
# value lives in the untracked .env beside docker-compose.yml and in the
# password manager, never here.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-bot
    receivers:
      - uid: homelab-discord-bot
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://alert-bot:8080/grafana
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $ALERT_BOT_SECRET

policies:
  - orgId: 1
    receiver: discord-bot
    group_by: [grafana_folder, alertname]
    # Wait 30s so a host going down arrives as one message, not one per rule
    # that noticed it. Re-send a still-firing alert every four hours, which is
    # a reasonable nag for this environment and stops Grafana repeating itself every
    # evaluation.
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Update notices are a different rhythm. One message when a host or an
      # image first has something waiting, one when it is patched, and nothing
      # in between: repeat_interval is a year, which in practice means never.
      # Grouped by alert name only, so twelve hosts with pending updates arrive
      # as one embed listing twelve hosts, and a five-minute group_wait lets
      # the whole fleet's textfiles land before the first message. Added
      # 2026-09-02.
      - receiver: discord-bot
        object_matchers:
          - ["class", "=", "updates"]
        group_by: [alertname]
        group_wait: 5m
        group_interval: 30m
        repeat_interval: 8760h
