# Grafana alert rules, deployed at
# /home/dkadi/monitoring/grafana/provisioning/alerting/ on monitor-01.
#
# Created 2026-08-31. Before this file the environment had no alerting of any
# kind: Prometheus loaded zero rule groups and knew no Alertmanager, and
# Grafana's provisioner found only a .gitkeep. A scrape target sat down for
# three and a half days in August and the only thing that caught it was me
# noticing a red panel. These rules are the answer to that.
#
# Grafana-managed rather than Prometheus `rule_files`, because Prometheus can
# evaluate a rule but cannot deliver it anywhere without an Alertmanager, and
# that is another container plus another config holding another secret. Grafana
# is already running with its scheduler active, so this adds no moving parts.
#
# Provisioned rules are read-only in the web interface, the same choice the
# datasource file makes. The file is the source of truth; change the rule here.
#
# Threshold philosophy: every threshold below was checked against the live value
# on the day it was written, 2026-08-31 or 2026-09-01, and sits clear of it, so a
# fresh deploy fires nothing. An alert
# that cries wolf on day one gets muted by week two.
apiVersion: 1

groups:
  # =====================================================================
  # Something that should be running is not.
  # 1m evaluation: these are the ones worth knowing about quickly.
  # =====================================================================
  - orgId: 1
    name: Availability
    folder: Homelab Alerts
    interval: 1m
    rules:
      # The plain "a machine stopped answering" alert.
      - uid: homelab-host-down
        title: Host is down
        condition: B
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: '{{ $labels.host }} has stopped answering Prometheus.'
          description: >-
            node_exporter on {{ $labels.host }} ({{ $labels.instance }}) has
            failed every scrape for 5 minutes. The host is off, has lost its
            network path, or node_exporter itself has died. Everything running
            on it should be treated as unavailable until this clears.
        # NoData here means Prometheus itself is unreachable from Grafana, which
        # is worth an alert of its own rather than silence.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'up{job="node"}'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: lt, params: [0.5]}

      # This is the rule that would have caught the ups01 blind spot. It covers
      # every job except `node`, so a dead exporter is not invisible just
      # because the machine underneath it is fine.
      #
      # The `unless on(host)` clause suppresses this when the host itself is
      # down, since "Host is down" above already says so and two alerts for one
      # outage is how people learn to ignore alerts. Targets with no `host`
      # label (blackbox, proxmox) match nothing on the right-hand side and are
      # correctly kept.
      - uid: homelab-exporter-down
        title: Metrics source stopped reporting
        condition: B
        for: 10m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: 'Scrape target {{ $labels.instance }} ({{ $labels.job }}) is down.'
          description: >-
            This target has failed every scrape for 10 minutes while its host is
            still up, so the exporter is the problem rather than the machine.
            Whatever this target measures is now unmonitored and will stay that
            way silently. In August 2026 that condition lasted three and a half
            days.
        # A filtered expression returns nothing when everything is healthy, so
        # empty must read as OK rather than as missing data.
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'up{job!="node"} == 0 unless on(host) (up{job="node"} == 0)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [0.5]}

      # Lost connectivity, from the direction that matters: the blackbox prober
      # walks the real user path, so a failure here means local DNS, the proxy,
      # the certificate, or the backend is broken.
      - uid: homelab-service-unreachable
        title: Internal service is unreachable
        condition: B
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: '{{ $labels.instance }} is not responding.'
          description: >-
            The blackbox prober has failed to get a 2xx from this address for 5
            minutes. It walks the same path a browser does, so the fault is in
            local DNS, Nginx Proxy Manager, the certificate, or the service
            behind it.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'probe_success'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: lt, params: [0.5]}

      # Cluster nodes and quorum only. Guests are deliberately excluded:
      # qemu/101, qemu/102 and qemu/9000 are stopped on purpose, so a
      # guest-level rule would fire three false alarms the moment it loaded.
      - uid: homelab-proxmox-node-down
        title: Proxmox node or cluster is down
        condition: B
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: 'Proxmox reports {{ $labels.id }} as down.'
          description: >-
            The PVE API reports this node or the Galaxy cluster itself as not
            running. If it names the cluster, quorum is lost and the remaining
            nodes will refuse to start guests.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'pve_up{id=~"node/.+|cluster/.+"}'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: lt, params: [0.5]}


      # Which VM or LXC went down, by name. "Down" here means it was running at
      # some point in the last two hours and is not running now, which is what
      # separates a crash from a guest I stopped on purpose. qemu/101 and
      # qemu/9000 are templates and qemu/102 has been off for weeks; none of
      # them can trip this. The cost of the design is that a guest I stop
      # deliberately fires once and clears itself two hours later.
      #
      # pve_onboot_status looked like the cleaner filter, but the exporter only
      # reads guest configs from the node it is pointed at, so on 2026-09-01 it
      # covered 5 of 16 guests, all on grey-server. Not usable.
      #
      # pve_guest_info has exactly one series per guest, 16 of 16 on
      # 2026-09-01, so the name join drops nothing. Added 2026-09-01.
      - uid: homelab-guest-down
        title: VM or container is down
        condition: B
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: '{{ $labels.name }} ({{ $labels.id }}) on {{ $labels.node }} has stopped.'
          description: >-
            This guest was running within the last two hours and Proxmox now reports
            it stopped. If you did not stop it yourself, it crashed or was
            killed. If you did, this clears on its own two hours after the stop.
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: >-
                (max_over_time(pve_up{id=~"qemu/.+|lxc/.+"}[2h]) == 1 and pve_up{id=~"qemu/.+|lxc/.+"} == 0)
                * on(id) group_left(name, node) pve_guest_info
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [0.5]}

      # A container that keeps dying and being brought back by its restart
      # policy. cAdvisor's start-time gauge moves on every restart while the
      # container id, and so the series, stays the same. Four or more moves in
      # fifteen minutes is a crash loop, not a deploy: a compose recreate gives
      # a new id and a new series that starts at zero changes. The fleet-wide
      # maximum on 2026-09-02 was 0. Added 2026-09-02.
      - uid: homelab-container-restarting
        title: Container is restart-looping
        condition: B
        for: 2m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: '{{ $labels.name }} on {{ $labels.host }} restarted {{ humanize $values.A.Value }} times in 15 minutes.'
          description: >-
            Docker keeps restarting this container and it keeps exiting. The
            process is crashing on start: a bad config, a missing dependency,
            a full disk, or a database it cannot reach. `docker logs` on
            {{ $labels.host }} says which.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'max by (host, name) (changes(container_start_time_seconds{name!=""}[15m]))'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [3]}

  # =====================================================================
  # Running out of something. 5m evaluation and long `for` windows, because
  # none of these need a fast answer and a backup burst should not page.
  # =====================================================================
  - orgId: 1
    name: Capacity
    folder: Homelab Alerts
    interval: 5m
    rules:
      # ZFS is excluded here on purpose. All three zfs mountpoints belong to the
      # single hddpool-1 pool, and every dataset in a pool reports the same free
      # space, so grey-server:/hddpool-1, grey-server:/hddpool-1/subvol-110-disk-0
      # and docker-main:/data would all cross the threshold in the same minute
      # for one problem. The Proxmox storage rule below owns pools instead and
      # reports each one once. Nothing is blinded by this: no host is ZFS-only.
      # fuse and fuse.lxcfs are excluded because lxcfs mirrors host values into
      # guests rather than measuring anything of its own.
      #
      # 85%: with zfs excluded, the fullest filesystem this rule watches on
      # 2026-08-31 was media-01:/data at 67.1%. hddpool-1 is the fuller thing at
      # 81.4%, and the Proxmox storage rule below is what watches that.
      - uid: homelab-filesystem-filling
        title: Filesystem is almost full
        condition: B
        for: 15m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: '{{ $labels.host }} {{ $labels.mountpoint }} is {{ humanize $values.A.Value }}% full.'
          description: >-
            This filesystem has been above 85% for 15 minutes. There are no
            backups here by design, so a full disk is fixed by finding what grew
            rather than by restoring anything.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: >-
                100 - 100 * (
                  node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|zfs|fuse.*"}
                  /
                  node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|zfs|fuse.*"}
                )
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [85]}

      # Owns the ZFS pools and the LVM thin pools. This is not redundant with the
      # filesystem rule: a thin pool holds VM disks that no guest filesystem can
      # see, so local-lvm can fill while every guest still reports plenty free.
      - uid: homelab-pve-storage-filling
        title: Proxmox storage is almost full
        condition: B
        for: 15m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: '{{ $labels.id }} is {{ humanize $values.A.Value }}% full.'
          description: >-
            A Proxmox storage has been above 85% for 15 minutes. For a thin LVM
            pool this is the number that matters, because guests cannot see it
            and will keep writing until it stops them.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'pve_disk_usage_bytes{id=~"storage/.+"} / pve_disk_size_bytes{id=~"storage/.+"} * 100'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [85]}

      # 92% rather than 90%: grey-server sits at 77% with ZFS ARC counted, and
      # ARC is reclaimable, so a tighter threshold would flap on a healthy host.
      - uid: homelab-memory-exhausted
        title: Memory is nearly exhausted
        condition: B
        for: 15m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: '{{ $labels.host }} is using {{ humanize $values.A.Value }}% of memory.'
          description: >-
            Available memory on {{ $labels.host }} has been under 8% for 15
            minutes. The next allocation that fails gets something killed by the
            OOM reaper, and it will not be the process you would have chosen.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: '100 - 100 * (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [92]}

      # Storage lag, as opposed to storage capacity: the fraction of wall-clock
      # time a device spends with I/O in flight. Sustained 95% means requests are
      # queueing and everything on that disk feels slow.
      #
      # Hypervisors only, and aggregated to one value per host. LXC guests see
      # their host's block devices through /proc, so an unfiltered rule would
      # report grey-server's disks again as ansible-01 and docker-main. Busiest
      # node on 2026-08-31 was grey-server at 24%.
      - uid: homelab-disk-saturated
        title: Disk is saturated
        condition: B
        for: 20m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: '{{ $labels.host }} has a disk busy {{ humanize $values.A.Value }}% of the time.'
          description: >-
            A block device on {{ $labels.host }} has been busy essentially
            continuously for 20 minutes. Guests on this node will be slow to
            respond even though nothing is down.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'max by (host) (rate(node_disk_io_time_seconds_total{role="hypervisor",device!~"loop.*|zram.*"}[5m]) * 100)'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [95]}


      # CPU, for every guest and every node in one rule. pve_cpu_usage_ratio is
      # Proxmox's own figure, already relative to the cores a guest is assigned,
      # so 0.9 means "using nine tenths of everything it has" whether that is 2
      # cores or 16. Guests get their name joined in; nodes pass through under
      # their id. Busiest on 2026-09-01 was media-01 at 57%.
      #
      # The Proxmox view rather than node_exporter on purpose: it covers the
      # guests that run no exporter, and it attributes CPU per guest, so there
      # is nothing to deduplicate. Added 2026-09-01.
      - uid: homelab-cpu-pinned
        title: CPU is pinned
        condition: B
        for: 15m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: '{{ if $labels.name }}{{ $labels.name }}{{ else }}{{ $labels.id }}{{ end }} has been above 90% CPU for 15 minutes.'
          description: >-
            Proxmox reports this guest or node using more than 90% of the cores it
            has, sustained for 15 minutes. Something is either doing real work
            that needs more cores, or spinning.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: >-
                (pve_cpu_usage_ratio{id=~"qemu/.+|lxc/.+"} * on(id) group_left(name, node) pve_guest_info)
                or pve_cpu_usage_ratio{id=~"node/.+"}
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [0.9]}

      # Run queue against core count, hypervisors only. This is the "using all
      # its cores" alert: a load of two per core sustained for 15 minutes means
      # the machine has twice as much runnable work as it can execute.
      #
      # Hypervisors only because lxcfs does not virtualise /proc/loadavg. On
      # 2026-09-01 ansible-01, docker-main and grey-server all read 2.06, and
      # docker-blue, monitor-01 and blue-server all read 0.25: the guests are
      # reporting their host's number. Highest per-core figure that day was
      # red-server at 0.37. Added 2026-09-01.
      - uid: homelab-load-overloaded
        title: Host is overloaded
        condition: B
        for: 15m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: '{{ $labels.host }} has a 15-minute load of {{ humanize $values.A.Value }} per core.'
          description: >-
            Load average is the number of threads running or waiting to run. Two per
            core for 15 minutes means work is queueing behind the CPUs or behind
            I/O, and every guest on {{ $labels.host }} feels it. Read it with
            the CPU rule: high load and low CPU is I/O wait.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: >-
                node_load15{role="hypervisor"}
                / on(host) group_left count by (host) (node_cpu_seconds_total{mode="idle"})
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [2]}

  # =====================================================================
  # Slow rather than absent.
  # =====================================================================
  - orgId: 1
    name: Network
    folder: Homelab Alerts
    interval: 1m
    rules:
      # Network lag on the path people actually use. Every probe on 2026-08-31
      # answered in 0.12s or less, so 5s is roughly forty times the worst normal
      # case and will not fire on a slow page load.
      - uid: homelab-service-slow
        title: Internal service is responding slowly
        condition: B
        for: 10m
        labels:
          severity: warning
          category: network
        annotations:
          summary: '{{ $labels.instance }} is taking {{ humanize $values.A.Value }}s to respond.'
          description: >-
            This probe normally completes in well under a second. Ten minutes
            above 5 seconds points at DNS resolution, the proxy, or a backend
            that is alive but struggling.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'probe_duration_seconds'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [5]}

      # blackbox verifies the wildcard certificate on every probe, so it knows
      # when the certificate NPM is serving expires. NPM renews on its own
      # inside the last 30 days, and says nothing either way. On 2026-09-02 the
      # certificate had 36 days left. Firing at 14 gives a failed renewal two
      # weeks of warning before the browser gives none. Added 2026-09-02.
      - uid: homelab-cert-expiring
        title: TLS certificate is expiring
        condition: B
        for: 1h
        labels:
          severity: warning
          category: network
        annotations:
          summary: '{{ $labels.instance }} is serving a certificate that expires in {{ humanize $values.A.Value }} days.'
          description: >-
            Nginx Proxy Manager should have renewed this already. Check its
            SSL Certificates page and the Cloudflare DNS token it uses for the
            DNS-01 challenge. Every internal name shares the one wildcard, so
            if one fires they all will.
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: '(probe_ssl_earliest_cert_expiry - time()) / 86400'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: lt, params: [14]}

  # =====================================================================
  # Power and hardware.
  # =====================================================================
  - orgId: 1
    name: Power and hardware
    folder: Homelab Alerts
    interval: 1m
    rules:
      # UPS-02 carries every Galaxy node, the gateway, the switch and the ONT.
      # `for: 1m` because this one is a clock counting down, not a trend.
      #
      # UPS-01 cannot trigger this: its data cable is unplugged as of 2026-08-28
      # and it reports nothing. See the root TODO.
      - uid: homelab-ups-on-battery
        title: UPS is running on battery
        condition: B
        for: 1m
        labels:
          severity: critical
          category: power
        annotations:
          summary: '{{ $labels.ups }} has lost mains power and is on battery.'
          description: >-
            {{ $labels.ups }} is discharging. It feeds the Galaxy nodes, the
            gateway, the switch and the ONT, so this is a countdown to the whole
            cluster stopping. nut-monitor is disabled by choice, meaning nothing
            will shut anything down gracefully on your behalf.
        # This filtered expression is empty while the UPS is online.
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'nut_ups_status{status="OB"}'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [0.5]}

      # Three states in one rule rather than three rules: LB is the battery
      # running out during an outage, RB is the UPS asking for a new battery,
      # and FSD means it has begun a forced shutdown. The status label says
      # which one.
      - uid: homelab-ups-battery-fault
        title: UPS battery needs attention
        condition: B
        for: 5m
        labels:
          severity: critical
          category: power
        annotations:
          summary: '{{ $labels.ups }} reports status {{ $labels.status }}.'
          description: >-
            LB means the battery is nearly flat during an outage. RB means the
            UPS wants the battery replaced, which it can report while running
            normally on mains. FSD means it has started a forced shutdown.
        # This filtered expression is empty while no fault state is active.
        noDataState: OK
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'nut_ups_status{status=~"LB|RB|FSD"}'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [0.5]}

      # Overheating. Hypervisors only and reduced to one value per host, for the
      # same reason as the disk rule: an LXC guest reads its host's hwmon
      # sensors, so green-server's chip would otherwise alert twice, once as
      # itself and once as game-01.
      #
      # 80C for 10 minutes. The hottest node on 2026-08-31 was grey-server at
      # 52.6C, and a brief spike under load is not interesting.
      - uid: homelab-temperature-high
        title: Hardware is running hot
        condition: B
        for: 10m
        labels:
          severity: warning
          category: hardware
        annotations:
          summary: '{{ $labels.host }} has a sensor at {{ humanize $values.A.Value }}C.'
          description: >-
            A sensor on {{ $labels.host }} has been above 80C for 10 minutes.
            Check the fans and the intake before the CPU starts throttling
            itself, or the NVMe drive does.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'max by (host) (node_hwmon_temp_celsius{role="hypervisor"})'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [80]}

  # =====================================================================
  # Drive health on the Proxmox nodes. Read from smartmon.prom and nvme.prom,
  # which the prometheus-node-exporter-collectors package writes every 15
  # minutes on the four Lenovo nodes. grey-server joins once its textfile
  # collector is enabled. Added 2026-09-02.
  # =====================================================================
  - orgId: 1
    name: Storage health
    folder: Homelab Alerts
    interval: 5m
    rules:
      # role="hypervisor" on purpose. The same script reports a QEMU virtio
      # disk as unhealthy because the virtual disk has no SMART self-assessment
      # at all, and alpha-prod-01 and ubuntu-dev both read 0 today for exactly
      # that reason. Only a real drive in a real node counts here.
      - uid: homelab-smart-unhealthy
        title: Drive failed its SMART health check
        condition: B
        for: 15m
        labels:
          severity: critical
          category: hardware
        annotations:
          summary: '{{ $labels.disk }} on {{ $labels.host }} reports SMART overall health FAILED.'
          description: >-
            The drive's own controller has decided it is failing. Copy what
            matters off it now and plan the replacement; the purple-server
            boot NVMe went from this state to unbootable in three days in
            July 2026.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'smartmon_device_smart_healthy{role="hypervisor"}'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: lt, params: [0.5]}

      # The purple-server boot NVMe died on 2026-07-22 with critical warning
      # 0x04, media placed in read-only mode. Any non-zero bit in this field is
      # the drive saying something is wrong: spare below threshold, over
      # temperature, degraded reliability, read-only, or a failed backup
      # device. All four nodes read 0 on 2026-09-02.
      - uid: homelab-nvme-critical-warning
        title: NVMe drive reports a critical warning
        condition: B
        for: 5m
        labels:
          severity: critical
          category: hardware
        annotations:
          summary: '{{ $labels.device }} on {{ $labels.host }} has critical warning bitmap {{ $values.A.Value }}.'
          description: >-
            Run `nvme smart-log` on {{ $labels.host }} to decode the bits.
            0x04 is media in read-only mode, which is what took purple-server
            down. Treat it as a failing drive until proven otherwise.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'nvme_critical_warning{role="hypervisor"}'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [0]}

      # Wear, as the drive itself estimates it. purple-server's replacement
      # drive already reads 30 percent used; the other three are at 11 or
      # less. Past 90 the vendor no longer guarantees the cells, and past 100
      # the counter keeps going while the drive keeps working, until it does not.
      - uid: homelab-nvme-worn
        title: NVMe drive is nearly worn out
        condition: B
        for: 1h
        labels:
          severity: warning
          category: hardware
        annotations:
          summary: '{{ $labels.device }} on {{ $labels.host }} is {{ humanizePercentage $values.A.Value }} through its rated write endurance.'
          description: >-
            Not urgent, but budget a replacement. This is a percentage of the
            vendor's rated write endurance, so it climbs slowly and predictably.
        noDataState: NoData
        execErrState: Error
        isPaused: false
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: bfgnkdi47u5tsa
            model:
              refId: A
              editorMode: code
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              expr: 'nvme_percentage_used_ratio{role="hypervisor"}'
          - refId: B
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - type: query
                  query: {params: [A]}
                  reducer: {type: last, params: []}
                  operator: {type: and}
                  evaluator: {type: gt, params: [0.9]}
