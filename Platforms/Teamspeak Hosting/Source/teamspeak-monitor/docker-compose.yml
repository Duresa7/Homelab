# TeamSpeak reachability collector.
#
# It writes a Prometheus textfile into the host's node_exporter collector
# directory, so the metrics arrive over the 192.168.80.118:9100 scrape that
# already exists. That is deliberate: monitor-01 sits on the locked-down
# observability VLAN and can't open a new outbound path, and TeamSpeak voice is
# UDP, which blackbox_exporter cannot probe at all.
#
# host networking so the local voice and ServerQuery ports are reachable at
# 127.0.0.1 exactly as a local client would see them.
services:
  teamspeak-monitor:
    build: .
    image: teamspeak-monitor:local
    container_name: teamspeak-monitor
    restart: unless-stopped
    network_mode: host
    environment:
      TS_BASE_DOMAIN: <YOUR_BASE_DOMAIN>
      TS_HOST_IP: 127.0.0.1
      TS_INTERVAL: "60"
      TS_OUT: /textfile/teamspeak.prom
    # Optional ServerQuery stats: clients online, channels, uptime, slots.
    # Create .env beside this file with TS_QUERY_USER and TS_QUERY_PASS to
    # enable them. Without it the reachability metrics still work.
    env_file:
      - path: .env
        required: false
    volumes:
      - /var/lib/prometheus/node-exporter:/textfile
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
