version: 2
name: homelab
displayName: Homelab MCP Catalog
registry:
  ssh-manager:
    title: SSH Manager
    type: server
    image: homelab/mcp-ssh-manager:latest
    description: Manage homelab machines over SSH through MCP.
    readme: https://github.com/bvisible/mcp-ssh-manager
    allowHosts:
      - 192.168.70.10:22
      - 192.168.70.11:22
      - 192.168.70.12:22
      - 192.168.70.13:22
      - 192.168.70.14:22
      - 192.168.40.35:22
      - 192.168.80.118:22
      - 192.168.80.10:22
      - 192.168.30.10:22
      - 192.168.40.36:22
      - 192.168.73.2:22
      - 192.168.85.2:22
      - 192.168.72.2:22
      - 192.168.72.3:22
      - 192.168.40.39:22
      - 192.168.40.42:22
      - 192.168.80.30:22
      - 192.168.40.179:22
    longLived: true
    volumes:
      - ssh-manager-state:/state
    secrets:
      - name: ssh-manager.private_key_b64
        env: SSH_PRIVATE_KEY_B64
        example: base64-encoded-openssh-private-key
      - name: ssh-manager.alpha_prod_01_sudo_password
        env: SSH_SERVER_ALPHA_PROD_01_SUDO_PASSWORD
        example: sudo-password
      - name: ssh-manager.app_01_sudo_password
        env: SSH_SERVER_APP_01_SUDO_PASSWORD
        example: sudo-password
      - name: ssh-manager.docker_blue_sudo_password
        env: SSH_SERVER_DOCKER_BLUE_SUDO_PASSWORD
        example: sudo-password
      - name: ssh-manager.docker_network_sudo_password
        env: SSH_SERVER_DOCKER_NETWORK_SUDO_PASSWORD
        example: sudo-password
      - name: ssh-manager.edge_01_sudo_password
        env: SSH_SERVER_EDGE_01_SUDO_PASSWORD
        example: sudo-password
      - name: ssh-manager.game_01_sudo_password
        env: SSH_SERVER_GAME_01_SUDO_PASSWORD
        example: sudo-password
      - name: ssh-manager.media_01_sudo_password
        env: SSH_SERVER_MEDIA_01_SUDO_PASSWORD
        example: sudo-password
      - name: ssh-manager.monitor_01_sudo_password
        env: SSH_SERVER_MONITOR_01_SUDO_PASSWORD
        example: sudo-password
      - name: ssh-manager.security_01_sudo_password
        env: SSH_SERVER_SECURITY_01_SUDO_PASSWORD
        example: sudo-password
