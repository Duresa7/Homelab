pollinterval = 5
maxretry = 3

# UPS-01 is commented out as of 2026-08-31.
#
# Its USB data cable was disconnected on 2026-08-28 during a UPS swap and is
# not plugged into any node. red-server now draws power from UPS-02, whose
# data cable is on grey-server and reports there as ups02.
#
# With no UPS attached, usbhid-ups failed and systemd restarted it every five
# seconds: 12,014 restarts and 75,292 journal lines in the 24 hours to
# 2026-08-31, which was also 62.9 per cent of all fleet Wazuh alerts on
# 2026-08-29. Commenting out the stanza is what actually stops it, because
# nut-driver-enumerator rebuilds the driver under an MD5-hashed instance name
# and therefore walks straight past a mask on nut-driver@ups01.service.
#
# To restore: plug the UPS-01 USB cable into red-server, uncomment the block
# below, then run
#     systemctl unmask nut-server.service
#     systemctl enable nut.target nut-driver.target nut-driver-enumerator.service nut-driver-enumerator.path
#     systemctl start nut.target
#     systemctl enable --now nut-server.service
#     systemctl restart nut-driver-enumerator.service
# and re-add the 192.168.70.13 target to the Prometheus nut job and to PeaNUT.
# nut-monitor.service stays masked until automatic shutdown is configured.
# The NUT targets and enumerator were disabled on 2026-10-07 while UPS-01
# remains disconnected; nut-server.service was masked to prevent boot failures.
#
#[ups01]
#    driver = usbhid-ups
#    port = auto
#    vendorid = 051d
#    productid = 0002
#    desc = "UPS-01 APC Back-UPS Pro BR1500MS2 on red-server"
